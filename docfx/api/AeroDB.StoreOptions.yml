  namespace: AeroDB
  summary: >-
    When true, documents with an <xref href="AeroDB.IVersioned" data-throw-if-not-resolved="false"></xref> version field or

    a property decorated with <xref href="AeroDB.VersionAttribute" data-throw-if-not-resolved="false"></xref> are protected

    against lost updates. Before saving a modified document, AeroDB checks that

    the current database version matches the version captured when the document

