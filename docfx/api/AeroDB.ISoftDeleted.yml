  assemblies:
  - AeroDB
  namespace: AeroDB
  summary: >-
    Marks an entity as soft-deletable. AeroDB uses these properties directly on the entity

    (unlike Marten which uses shadow columns <code>mt_deleted</code> and <code>mt_deleted_at</code>).

    Queries on <xref href="AeroDB.ISoftDeleted" data-throw-if-not-resolved="false"></xref> types automatically exclude entities where <code>Deleted == true</code>.
  example: []
