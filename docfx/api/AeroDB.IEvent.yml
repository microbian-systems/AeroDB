  name: IEvent
  nameWithType: IEvent
  fullName: AeroDB.IEvent
  type: Interface
  source:
    href: https://github.com/microbian-systems/AeroDB/blob/9cfbbf2dab7dff5f6032048bca90bb9c8b2c674a/src/AeroDB/Events/IEvent.cs
  assemblies:
  - AeroDB
  namespace: AeroDB
  summary: >-
    Non-generic event envelope. <code>Event&lt;T&gt;</code> implements both <xref href="AeroDB.IEvent%601" data-throw-if-not-resolved="false"></xref>

    and <xref href="AeroDB.IEvent" data-throw-if-not-resolved="false"></xref> for maximum compatibility.
  remarks: >-
    This is deliberately <b>not</b> <code>IEvent&lt;object&gt;</code> because C# does not allow

    implicit conversion from <code>Event&lt;T&gt;</code> (which implements <code>IEvent&lt;T&gt;</code>)

    to a separate interface that inherits from <code>IEvent&lt;object&gt;</code>.

    Instead, <xref href="AeroDB.Event%601" data-throw-if-not-resolved="false"></xref> explicitly implements both interfaces.
  example: []
  syntax:
    content: public interface IEvent
    content.vb: Public Interface IEvent
  derivedClasses:
  - AeroDB.Event`1
