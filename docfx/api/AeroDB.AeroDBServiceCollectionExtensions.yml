  isExtensionMethod: true
  parent: AeroDB.AeroDBServiceCollectionExtensions
  langs:
  - csharp
  - vb
  name: AddAeroDBStore<T>(IServiceCollection, Action<StoreOptions>)
  nameWithType: AeroDBServiceCollectionExtensions.AddAeroDBStore<T>(IServiceCollection, Action<StoreOptions>)
  fullName: AeroDB.AeroDBServiceCollectionExtensions.AddAeroDBStore<T>(Microsoft.Extensions.DependencyInjection.IServiceCollection, System.Action<AeroDB.StoreOptions>)
  type: Method
  source:
    href: https://github.com/microbian-systems/AeroDB/blob/9cfbbf2dab7dff5f6032048bca90bb9c8b2c674a/src/AeroDB/Configuration/AeroDBServiceCollectionExtensions.cs
  assemblies:
  - AeroDB
  namespace: AeroDB
  summary: >-
    Registers a secondary AeroDB <xref href="AeroDB.IDocumentStore" data-throw-if-not-resolved="false"></xref> as a keyed scoped service,

    keyed by <code class="typeparamref">T</code>. Use <code>AddAeroDBStore&lt;IInvoicingStore&gt;(opts =&gt; ...)</code>

    for multi-database scenarios where <code class="typeparamref">T</code> is a marker interface

    extending <xref href="AeroDB.IDocumentStore" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: 'public static IServiceCollection AddAeroDBStore<T>(this IServiceCollection services, Action<StoreOptions> configure) where T : class, IDocumentStore'
    parameters:
    - id: services
      type: Microsoft.Extensions.DependencyInjection.IServiceCollection
      description: The service collection.
    - id: configure
      type: System.Action{AeroDB.StoreOptions}
      description: A delegate to configure <xref href="AeroDB.StoreOptions" data-throw-if-not-resolved="false"></xref>.
    typeParameters:
    - id: T
      description: 'A marker interface (e.g., <code>IInvoicingStore : IDocumentStore</code>).'
    return:
      type: Microsoft.Extensions.DependencyInjection.IServiceCollection
      description: The service collection for chaining.
    content.vb: Public Shared Function AddAeroDBStore(Of T As {Class, IDocumentStore})(services As IServiceCollection, configure As Action(Of StoreOptions)) As IServiceCollection
  overload: AeroDB.AeroDBServiceCollectionExtensions.AddAeroDBStore*
