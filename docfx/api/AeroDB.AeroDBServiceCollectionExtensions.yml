  namespace: AeroDB
  summary: >-
    Registers a typed configuration delegate for <xref href="AeroDB.StoreOptions" data-throw-if-not-resolved="false"></xref>,

    following the named options configurator pattern.
  example: []
  syntax:
    content: 'public static IServiceCollection ConfigureAeroDB<T>(this IServiceCollection services, Action<StoreOptions> configure) where T : class'
    parameters:
    - id: services
      type: Microsoft.Extensions.DependencyInjection.IServiceCollection
      description: The service collection.
    - id: configure
      type: System.Action{AeroDB.StoreOptions}
      description: A delegate to configure <xref href="AeroDB.StoreOptions" data-throw-if-not-resolved="false"></xref>.
    typeParameters:
    - id: T
      description: The marker type for the configuration.
    return:
      type: Microsoft.Extensions.DependencyInjection.IServiceCollection
      description: The service collection for chaining.
    content.vb: Public Shared Function ConfigureAeroDB(Of T As Class)(services As IServiceCollection, configure As Action(Of StoreOptions)) As IServiceCollection
