  parent: AeroDB.EventProjection
  langs:
  - csharp
  - vb
  name: RebuildAsync(IDocumentSession, CancellationToken)
  nameWithType: EventProjection.RebuildAsync(IDocumentSession, CancellationToken)
  fullName: AeroDB.EventProjection.RebuildAsync(AeroDB.IDocumentSession, System.Threading.CancellationToken)
  type: Method
  source:
    href: https://github.com/microbian-systems/AeroDB/blob/9cfbbf2dab7dff5f6032048bca90bb9c8b2c674a/src/AeroDB/Projections/EventProjectionNonGeneric.cs
  assemblies:
  - AeroDB
  namespace: AeroDB
  summary: >-
    Rebuild the projection by replaying ALL events from the event store.

    Used for initial projection creation or recovery after data loss.

    The projection is responsible for handling idempotency — calling

    this twice should produce the same result.
  example: []
  syntax:
    content: public virtual Task RebuildAsync(IDocumentSession session, CancellationToken ct)
    parameters:
    - id: session
      type: AeroDB.IDocumentSession
    - id: ct
      type: System.Threading.CancellationToken
    return:
      type: System.Threading.Tasks.Task
    content.vb: Public Overridable Function RebuildAsync(session As IDocumentSession, ct As CancellationToken) As Task
  overload: AeroDB.EventProjection.RebuildAsync*
  implements:
  - AeroDB.IProjection.RebuildAsync(AeroDB.IDocumentSession,System.Threading.CancellationToken)
