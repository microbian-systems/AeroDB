  assemblies:
  - AeroDB
  namespace: AeroDB
  summary: >-
    Executes hybrid search by fusing full-text and vector results

    using SurrealDB's Reciprocal Rank Fusion (search::rrf).

    Only valid when both MatchText and WithVector have been configured.
  example: []
  syntax:
    content: public Task<List<T>> FuseAsync(int rrfK = 60, int rrfLimit = 80, CancellationToken ct = default)
    parameters:
    - id: rrfK
      type: System.Int32
      description: RRF smoothness constant (k). Default 60.
    - id: rrfLimit
      type: System.Int32
      description: Maximum candidates per sub-query for RRF fusion. Default 80.
    - id: ct
      type: System.Threading.CancellationToken
      description: Cancellation token.
    return:
      type: System.Threading.Tasks.Task{System.Collections.Generic.List{{T}}}
