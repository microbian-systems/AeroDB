  - AeroDB
  namespace: AeroDB
  summary: >-
    Represents a geographic polygon. Each ring is a list of (longitude, latitude) points.

    The first ring is the exterior boundary; subsequent rings are interior holes.

    Serializes to SurrealDB GeoJSON format.
