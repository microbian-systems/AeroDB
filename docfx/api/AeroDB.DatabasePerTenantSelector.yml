- uid: AeroDB.DatabasePerTenantSelector.GetOrCreateClientAsync(System.String,System.Threading.CancellationToken)
  commentId: M:AeroDB.DatabasePerTenantSelector.GetOrCreateClientAsync(System.String,System.Threading.CancellationToken)
  id: GetOrCreateClientAsync(System.String,System.Threading.CancellationToken)
  parent: AeroDB.DatabasePerTenantSelector
  langs:
  - csharp
  - vb
  name: GetOrCreateClientAsync(string, CancellationToken)
  nameWithType: DatabasePerTenantSelector.GetOrCreateClientAsync(string, CancellationToken)
  fullName: AeroDB.DatabasePerTenantSelector.GetOrCreateClientAsync(string, System.Threading.CancellationToken)
  type: Method
  source:
    href: https://github.com/microbian-systems/AeroDB/blob/9cfbbf2dab7dff5f6032048bca90bb9c8b2c674a/src/AeroDB/MultiTenancy/DatabasePerTenantSelector.cs
  assemblies:
  - AeroDB
  namespace: AeroDB
  summary: >-
    Gets or creates an <xref href="SurrealDb.Net.ISurrealDbClient" data-throw-if-not-resolved="false"></xref> for the specified tenant.

    Each tenant is isolated in its own database: <code>{namespace}_{tenantId}</code>.

    Uses <code>GetOrAdd</code> with <xref href="System.Lazy%601" data-throw-if-not-resolved="false"></xref> to ensure only one client

    is created per tenant, even under concurrent calls.
  example: []
  syntax:
    content: public Task<ISurrealDbClient> GetOrCreateClientAsync(string tenantId, CancellationToken ct = default)
    parameters:
    - id: tenantId
      type: System.String
    - id: ct
      type: System.Threading.CancellationToken
    return:
      type: System.Threading.Tasks.Task{SurrealDb.Net.ISurrealDbClient}
    content.vb: Public Function GetOrCreateClientAsync(tenantId As String, ct As CancellationToken = Nothing) As Task(Of ISurrealDbClient)
