    href: https://github.com/microbian-systems/AeroDB/blob/9cfbbf2dab7dff5f6032048bca90bb9c8b2c674a/src/AeroDB.WolverineFx/WolverineEnvelopeSchemas.cs
  assemblies:
  - AeroDB.WolverineFx
  namespace: AeroDB.WolverineFx
  summary: >-
    Registers Wolverine envelope table schemas on <xref href="AeroDB.StoreOptions.Schema" data-throw-if-not-resolved="false"></xref>

    during <xref href="AeroDB.DocumentStore.InitializeAsync(System.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref> via the <xref href="AeroDB.IConfigureAeroDB" data-throw-if-not-resolved="false"></xref> hook.

    This replaces the hardcoded 131-line SchemaScript string in <xref href="AeroDB.WolverineFx.AeroDBMessageStore" data-throw-if-not-resolved="false"></xref>

    with proper typed POCOs and the AeroDB schema pipeline.
  example: []
  syntax:
