  summary: >-
    Loads a single document by its string ID and writes it as JSON to the HTTP response.

    Sets status to 404 if the document is not found.
  example: []
  syntax:
    content: 'public static Task WriteById<T>(this IQuerySession session, string id, HttpContext httpContext, CancellationToken ct = default) where T : class'
