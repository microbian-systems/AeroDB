    - id: session
      type: AeroDB.IQuerySession
      description: The query session.
    - id: id
      type: System.String
      description: The document ID (string form, e.g. <code>"person:john"</code>).
    - id: httpContext
      type: Microsoft.AspNetCore.Http.HttpContext
      description: The HTTP context to write the response to.
    - id: ct
      type: System.Threading.CancellationToken
      description: Cancellation token.
    typeParameters:
    - id: T
      description: The document type.
    return:
      type: System.Threading.Tasks.Task
