- uid: AeroDB.SurrealDbQueryableExtensions.Include``2(AeroDB.ISurrealDbQueryable{``0},System.Linq.Expressions.Expression{System.Func{``0,``1}})
  commentId: M:AeroDB.SurrealDbQueryableExtensions.Include``2(AeroDB.ISurrealDbQueryable{``0},System.Linq.Expressions.Expression{System.Func{``0,``1}})
  id: Include``2(AeroDB.ISurrealDbQueryable{``0},System.Linq.Expressions.Expression{System.Func{``0,``1}})
  isExtensionMethod: true
  parent: AeroDB.SurrealDbQueryableExtensions
  langs:
  - csharp
  - vb
  name: Include<T, TInclude>(ISurrealDbQueryable<T>, Expression<Func<T, TInclude?>>)
  nameWithType: SurrealDbQueryableExtensions.Include<T, TInclude>(ISurrealDbQueryable<T>, Expression<Func<T, TInclude?>>)
  fullName: AeroDB.SurrealDbQueryableExtensions.Include<T, TInclude>(AeroDB.ISurrealDbQueryable<T>, System.Linq.Expressions.Expression<System.Func<T, TInclude?>>)
  type: Method
  source:
    href: https://github.com/microbian-systems/AeroDB/blob/9cfbbf2dab7dff5f6032048bca90bb9c8b2c674a/src/AeroDB/ISurrealDbQueryable.cs
  assemblies:
  - AeroDB
  namespace: AeroDB
  summary: >-
    Eagerly loads a typed <code>record&lt;T&gt;</code> property via an inline subquery.

    The subquery is embedded in the SELECT clause, using <code>$parent</code> to reference

    the parent row's foreign key field.


    <p>Generated SurrealQL pattern:

    <code>SELECT *, (SELECT * FROM `target` WHERE id = $parent.fk LIMIT 1)[0] AS Property FROM `source`</code>

    </p>


    <p>This is a single-round-trip operation — no separate queries are executed.

    Unlike <code>Fetch()</code>, this does not require the SurrealDB server to support

    the FETCH clause and works with typed <code>record&lt;T&gt;</code> properties.</p>
  example: []
  syntax:
    content: 'public static ISurrealDbQueryable<T> Include<T, TInclude>(this ISurrealDbQueryable<T> source, Expression<Func<T, TInclude?>> property) where T : class where TInclude : class'
    parameters:
    - id: source
      type: AeroDB.ISurrealDbQueryable{{T}}
      description: The queryable source.
    - id: property
      type: System.Linq.Expressions.Expression{System.Func{{T},{TInclude}}}
      description: >-
        A member expression selecting the typed record property to include.

        Example: <code>o =&gt; o.Customer</code>
    typeParameters:
    - id: T
      description: The source entity type.
    - id: TInclude
      description: The included document type (must inherit from <code>Record</code>).
    return:
      type: AeroDB.ISurrealDbQueryable{{T}}
      description: The queryable for chaining.
    content.vb: Public Shared Function Include(Of T As Class, TInclude As Class)(source As ISurrealDbQueryable(Of T), [property] As Expression(Of Func(Of T, TInclude))) As ISurrealDbQueryable(Of T)
  overload: AeroDB.SurrealDbQueryableExtensions.Include*
  nameWithType.vb: SurrealDbQueryableExtensions.Include(Of T, TInclude)(ISurrealDbQueryable(Of T), Expression(Of Func(Of T, TInclude)))
  fullName.vb: AeroDB.SurrealDbQueryableExtensions.Include(Of T, TInclude)(AeroDB.ISurrealDbQueryable(Of T), System.Linq.Expressions.Expression(Of System.Func(Of T, TInclude)))
  name.vb: Include(Of T, TInclude)(ISurrealDbQueryable(Of T), Expression(Of Func(Of T, TInclude)))
- uid: AeroDB.SurrealDbQueryableExtensions.IncludeReverse``2(AeroDB.ISurrealDbQueryable{``0},System.Linq.Expressions.Expression{System.Func{``0,System.Collections.Generic.IEnumerable{``1}}},System.String)
  commentId: M:AeroDB.SurrealDbQueryableExtensions.IncludeReverse``2(AeroDB.ISurrealDbQueryable{``0},System.Linq.Expressions.Expression{System.Func{``0,System.Collections.Generic.IEnumerable{``1}}},System.String)
  id: IncludeReverse``2(AeroDB.ISurrealDbQueryable{``0},System.Linq.Expressions.Expression{System.Func{``0,System.Collections.Generic.IEnumerable{``1}}},System.String)
  isExtensionMethod: true
  parent: AeroDB.SurrealDbQueryableExtensions
  langs:
  - csharp
  - vb
  name: IncludeReverse<T, TChild>(ISurrealDbQueryable<T>, Expression<Func<T, IEnumerable<TChild>?>>, string)
  nameWithType: SurrealDbQueryableExtensions.IncludeReverse<T, TChild>(ISurrealDbQueryable<T>, Expression<Func<T, IEnumerable<TChild>?>>, string)
  fullName: AeroDB.SurrealDbQueryableExtensions.IncludeReverse<T, TChild>(AeroDB.ISurrealDbQueryable<T>, System.Linq.Expressions.Expression<System.Func<T, System.Collections.Generic.IEnumerable<TChild>?>>, string)
  type: Method
  source:
    href: https://github.com/microbian-systems/AeroDB/blob/9cfbbf2dab7dff5f6032048bca90bb9c8b2c674a/src/AeroDB/ISurrealDbQueryable.cs
  assemblies:
  - AeroDB
  namespace: AeroDB
  summary: >-
    Eagerly loads a collection of child records where the child has a foreign key

    pointing back to the parent <code>T</code>. Uses SurrealDB's LET variable for

    <b>server-side batch loading in a single round trip</b>.


    <p>Generated SurrealQL pattern:

    <code>LET $main = (SELECT * FROM source WHERE ...);

    SELECT * FROM $main;

    SELECT * FROM `child` WHERE `fkField` IN (SELECT VALUE [id|Id] FROM $main);</code>

    </p>


    <p>Unlike <code>Include&lt;T,TInclude&gt;</code>,

    which is forward (FK on parent), this is reverse (FK on child). The child records

    are collected into a <code>List&lt;TChild&gt;</code> and set on the collection property.</p>
  example: []
  syntax:
    content: 'public static ISurrealDbQueryable<T> IncludeReverse<T, TChild>(this ISurrealDbQueryable<T> source, Expression<Func<T, IEnumerable<TChild>?>> property, string foreignKey) where T : class where TChild : class'
    parameters:
    - id: source
      type: AeroDB.ISurrealDbQueryable{{T}}
      description: The queryable source.
    - id: property
      type: System.Linq.Expressions.Expression{System.Func{{T},System.Collections.Generic.IEnumerable{{TChild}}}}
      description: >-
        A member expression selecting the collection property on T.

        Example: <code>o =&gt; o.Items</code>
    - id: foreignKey
      type: System.String
      description: >-
        The foreign key field on the child table (e.g., <code>"order"</code>).

        Both the C# property name and SurrealQL field name.
    typeParameters:
    - id: T
      description: The source entity type (must implement <code>IRecord</code> to have an Id).
    - id: TChild
      description: The child record type.
    return:
      type: AeroDB.ISurrealDbQueryable{{T}}
      description: The queryable for chaining.
    content.vb: Public Shared Function IncludeReverse(Of T As Class, TChild As Class)(source As ISurrealDbQueryable(Of T), [property] As Expression(Of Func(Of T, IEnumerable(Of TChild))), foreignKey As String) As ISurrealDbQueryable(Of T)
  overload: AeroDB.SurrealDbQueryableExtensions.IncludeReverse*
  nameWithType.vb: SurrealDbQueryableExtensions.IncludeReverse(Of T, TChild)(ISurrealDbQueryable(Of T), Expression(Of Func(Of T, IEnumerable(Of TChild))), String)
  fullName.vb: AeroDB.SurrealDbQueryableExtensions.IncludeReverse(Of T, TChild)(AeroDB.ISurrealDbQueryable(Of T), System.Linq.Expressions.Expression(Of System.Func(Of T, System.Collections.Generic.IEnumerable(Of TChild))), String)
  name.vb: IncludeReverse(Of T, TChild)(ISurrealDbQueryable(Of T), Expression(Of Func(Of T, IEnumerable(Of TChild))), String)
- uid: AeroDB.SurrealDbQueryableExtensions.FilterInclude``2(AeroDB.ISurrealDbQueryable{``0},System.Linq.Expressions.Expression{System.Func{``0,System.Collections.Generic.IEnumerable{``1}}},System.Linq.Expressions.Expression{System.Func{System.Collections.Generic.IEnumerable{``1},System.Boolean}})
  commentId: M:AeroDB.SurrealDbQueryableExtensions.FilterInclude``2(AeroDB.ISurrealDbQueryable{``0},System.Linq.Expressions.Expression{System.Func{``0,System.Collections.Generic.IEnumerable{``1}}},System.Linq.Expressions.Expression{System.Func{System.Collections.Generic.IEnumerable{``1},System.Boolean}})
  id: FilterInclude``2(AeroDB.ISurrealDbQueryable{``0},System.Linq.Expressions.Expression{System.Func{``0,System.Collections.Generic.IEnumerable{``1}}},System.Linq.Expressions.Expression{System.Func{System.Collections.Generic.IEnumerable{``1},System.Boolean}})
  isExtensionMethod: true
  parent: AeroDB.SurrealDbQueryableExtensions
  langs:
  - csharp
  - vb
  name: FilterInclude<T, TChild>(ISurrealDbQueryable<T>, Expression<Func<T, IEnumerable<TChild>>>, Expression<Func<IEnumerable<TChild>, bool>>)
  nameWithType: SurrealDbQueryableExtensions.FilterInclude<T, TChild>(ISurrealDbQueryable<T>, Expression<Func<T, IEnumerable<TChild>>>, Expression<Func<IEnumerable<TChild>, bool>>)
  fullName: AeroDB.SurrealDbQueryableExtensions.FilterInclude<T, TChild>(AeroDB.ISurrealDbQueryable<T>, System.Linq.Expressions.Expression<System.Func<T, System.Collections.Generic.IEnumerable<TChild>>>, System.Linq.Expressions.Expression<System.Func<System.Collections.Generic.IEnumerable<TChild>, bool>>)
  type: Method
  source:
    href: https://github.com/microbian-systems/AeroDB/blob/9cfbbf2dab7dff5f6032048bca90bb9c8b2c674a/src/AeroDB/ISurrealDbQueryable.cs
  assemblies:
  - AeroDB
  namespace: AeroDB
  summary: >-
    Filters parent documents based on a predicate applied to their included

    child collection <b>in-memory</b>, after includes are fully loaded.


    <p>Only parent documents whose child collection satisfies the predicate

    are returned. Unlike a WHERE clause, this filter runs on the client side

    and can use any LINQ expression on the child collection (e.g.,

    <code>.Any()</code>, <code>.All()</code>, <code>.Count()</code>).</p>


    <p>Must be used after <xref href="AeroDB.SurrealDbQueryableExtensions.IncludeReverse%60%602(AeroDB.ISurrealDbQueryable%7b%60%600%7d%2cSystem.Linq.Expressions.Expression%7bSystem.Func%7b%60%600%2cSystem.Collections.Generic.IEnumerable%7b%60%601%7d%7d%7d%2cSystem.String)" data-throw-if-not-resolved="false"></xref> on the same

    property to have effect. The filter does not affect which children are

    loaded — it only controls which parent documents are included in results.</p>
  example: []
  syntax:
    content: 'public static ISurrealDbQueryable<T> FilterInclude<T, TChild>(this ISurrealDbQueryable<T> source, Expression<Func<T, IEnumerable<TChild>>> property, Expression<Func<IEnumerable<TChild>, bool>> filter) where T : class where TChild : class'
    parameters:
    - id: source
      type: AeroDB.ISurrealDbQueryable{{T}}
      description: The queryable source.
    - id: property
      type: System.Linq.Expressions.Expression{System.Func{{T},System.Collections.Generic.IEnumerable{{TChild}}}}
      description: >-
        A member expression selecting the collection property on T.

        Example: <code>o =&gt; o.Items</code>
    - id: filter
      type: System.Linq.Expressions.Expression{System.Func{System.Collections.Generic.IEnumerable{{TChild}},System.Boolean}}
      description: >-
        A predicate applied to the child collection. Returning <code>true</code> keeps

        the parent in the result set.

        Example: <code>items =&gt; items.Any(i =&gt; i.Price &gt; 50)</code>
    typeParameters:
    - id: T
      description: The source entity type (must implement <code>IRecord</code>).
    - id: TChild
      description: The child record type.
    return:
      type: AeroDB.ISurrealDbQueryable{{T}}
      description: The queryable for chaining.
    content.vb: Public Shared Function FilterInclude(Of T As Class, TChild As Class)(source As ISurrealDbQueryable(Of T), [property] As Expression(Of Func(Of T, IEnumerable(Of TChild))), filter As Expression(Of Func(Of IEnumerable(Of TChild), Boolean))) As ISurrealDbQueryable(Of T)
  overload: AeroDB.SurrealDbQueryableExtensions.FilterInclude*
  nameWithType.vb: SurrealDbQueryableExtensions.FilterInclude(Of T, TChild)(ISurrealDbQueryable(Of T), Expression(Of Func(Of T, IEnumerable(Of TChild))), Expression(Of Func(Of IEnumerable(Of TChild), Boolean)))
  fullName.vb: AeroDB.SurrealDbQueryableExtensions.FilterInclude(Of T, TChild)(AeroDB.ISurrealDbQueryable(Of T), System.Linq.Expressions.Expression(Of System.Func(Of T, System.Collections.Generic.IEnumerable(Of TChild))), System.Linq.Expressions.Expression(Of System.Func(Of System.Collections.Generic.IEnumerable(Of TChild), Boolean)))
  name.vb: FilterInclude(Of T, TChild)(ISurrealDbQueryable(Of T), Expression(Of Func(Of T, IEnumerable(Of TChild))), Expression(Of Func(Of IEnumerable(Of TChild), Boolean)))
