  summary: >-
    Begins a partial update (patch) for documents matching a filter expression.

    The patch will be applied to ALL documents satisfying the predicate.
  example: []
  syntax:
    content: 'public static IPatchExpression<T> Patch<T>(this IDocumentSession session, Expression<Func<T, bool>> filter) where T : class'
    parameters:
    - id: session
      type: AeroDB.IDocumentSession
      description: The document session.
    - id: filter
      type: System.Linq.Expressions.Expression{System.Func{{T},System.Boolean}}
      description: Expression filter for documents to patch.
    typeParameters:
    - id: T
      description: The document type.
    return:
      type: AeroDB.IPatchExpression{{T}}
