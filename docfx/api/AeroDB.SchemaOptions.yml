- uid: AeroDB.SchemaOptions.Edge``3(System.Action{AeroDB.EdgeMapping{``0}})
  commentId: M:AeroDB.SchemaOptions.Edge``3(System.Action{AeroDB.EdgeMapping{``0}})
  id: Edge``3(System.Action{AeroDB.EdgeMapping{``0}})
  parent: AeroDB.SchemaOptions
  langs:
  - csharp
  - vb
  name: Edge<TEdge, TIn, TOut>(Action<EdgeMapping<TEdge>>)
  nameWithType: SchemaOptions.Edge<TEdge, TIn, TOut>(Action<EdgeMapping<TEdge>>)
