  source:
    href: https://github.com/microbian-systems/AeroDB/blob/9cfbbf2dab7dff5f6032048bca90bb9c8b2c674a/src/AeroDB/StoreOptions.cs
  assemblies:
  - AeroDB
  namespace: AeroDB
  summary: >-
    Fluent API for edge table schema configuration.

    Configures a SurrealDB RELATION table with IN/OUT type constraints.
  example: []
  syntax:
    content: 'public SchemaOptions Edge<TEdge, TIn, TOut>(Action<EdgeMapping<TEdge>> configure) where TEdge : EdgeRecord where TIn : Record where TOut : Record'
    parameters:
    - id: configure
      type: System.Action{AeroDB.EdgeMapping{{TEdge}}}
    typeParameters:
    - id: TEdge
      description: The edge record type (extends <xref href="AeroDB.EdgeRecord" data-throw-if-not-resolved="false"></xref>).
    - id: TIn
      description: The source/from node record type.
    - id: TOut
      description: The target/to node record type.
    return:
      type: AeroDB.SchemaOptions
    content.vb: Public Function Edge(Of TEdge As EdgeRecord, TIn As Record, TOut As Record)(configure As Action(Of EdgeMapping(Of TEdge))) As SchemaOptions
  overload: AeroDB.SchemaOptions.Edge*
