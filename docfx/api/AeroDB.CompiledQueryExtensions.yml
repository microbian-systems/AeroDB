  assemblies:
  - AeroDB
  namespace: AeroDB
  summary: Executes a compiled query and returns all results as a list.
  example: []
  syntax:
    content: 'public static Task<List<T>> QueryAsync<T>(this IQuerySession session, CompiledQuery<T> compiled, CancellationToken ct = default) where T : class'
    parameters:
    - id: session
      type: AeroDB.IQuerySession
      description: The query session.
    - id: compiled
      type: AeroDB.CompiledQuery{{T}}
      description: The compiled query to execute.
    - id: ct
      type: System.Threading.CancellationToken
      description: Cancellation token.
    typeParameters:
    - id: T
      description: The record type being queried.
    return:
      type: System.Threading.Tasks.Task{System.Collections.Generic.List{{T}}}
