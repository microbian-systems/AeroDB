- uid: AeroDB.CompiledQueryExtensions.CompileQuery``1(AeroDB.IDocumentStore,System.Linq.Expressions.Expression{System.Func{System.Linq.IQueryable{``0},System.Linq.IQueryable{``0}}})
  commentId: M:AeroDB.CompiledQueryExtensions.CompileQuery``1(AeroDB.IDocumentStore,System.Linq.Expressions.Expression{System.Func{System.Linq.IQueryable{``0},System.Linq.IQueryable{``0}}})
  id: CompileQuery``1(AeroDB.IDocumentStore,System.Linq.Expressions.Expression{System.Func{System.Linq.IQueryable{``0},System.Linq.IQueryable{``0}}})
  isExtensionMethod: true
  parent: AeroDB.CompiledQueryExtensions
  langs:
  - csharp
  - vb
  name: CompileQuery<T>(IDocumentStore, Expression<Func<IQueryable<T>, IQueryable<T>>>)
  nameWithType: CompiledQueryExtensions.CompileQuery<T>(IDocumentStore, Expression<Func<IQueryable<T>, IQueryable<T>>>)
  fullName: AeroDB.CompiledQueryExtensions.CompileQuery<T>(AeroDB.IDocumentStore, System.Linq.Expressions.Expression<System.Func<System.Linq.IQueryable<T>, System.Linq.IQueryable<T>>>)
  type: Method
  source:
    href: https://github.com/microbian-systems/AeroDB/blob/9cfbbf2dab7dff5f6032048bca90bb9c8b2c674a/src/AeroDB/Compiled/CompiledQueryExtensions.cs
  assemblies:
  - AeroDB
  namespace: AeroDB
  summary: >-
    Pre-compiles a LINQ expression into a reusable <xref href="AeroDB.CompiledQuery%601" data-throw-if-not-resolved="false"></xref>.

    The expression tree is walked once; subsequent executions reuse the cached SurrealQL.

    No store initialization or database connection is required — translation is purely local.
  example: []
  syntax:
    content: 'public static CompiledQuery<T> CompileQuery<T>(this IDocumentStore store, Expression<Func<IQueryable<T>, IQueryable<T>>> query) where T : class'
    parameters:
    - id: store
      type: AeroDB.IDocumentStore
      description: The document store (used as a logical anchor).
    - id: query
      type: System.Linq.Expressions.Expression{System.Func{System.Linq.IQueryable{{T}},System.Linq.IQueryable{{T}}}}
      description: An expression that transforms an <xref href="System.Linq.IQueryable%601" data-throw-if-not-resolved="false"></xref> (e.g. q =&gt; q.Where(p =&gt; p.Age &gt; 25).OrderBy(p =&gt; p.Name)).
    typeParameters:
    - id: T
      description: The record type being queried.
    return:
      type: AeroDB.CompiledQuery{{T}}
    content.vb: Public Shared Function CompileQuery(Of T As Class)(store As IDocumentStore, query As Expression(Of Func(Of IQueryable(Of T), IQueryable(Of T)))) As CompiledQuery(Of T)
  overload: AeroDB.CompiledQueryExtensions.CompileQuery*
  nameWithType.vb: CompiledQueryExtensions.CompileQuery(Of T)(IDocumentStore, Expression(Of Func(Of IQueryable(Of T), IQueryable(Of T))))
  fullName.vb: AeroDB.CompiledQueryExtensions.CompileQuery(Of T)(AeroDB.IDocumentStore, System.Linq.Expressions.Expression(Of System.Func(Of System.Linq.IQueryable(Of T), System.Linq.IQueryable(Of T))))
  name.vb: CompileQuery(Of T)(IDocumentStore, Expression(Of Func(Of IQueryable(Of T), IQueryable(Of T))))
