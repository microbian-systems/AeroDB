  name: AeroDBMessageStore
  nameWithType: AeroDBMessageStore
  fullName: AeroDB.WolverineFx.AeroDBMessageStore
  type: Class
  source:
    href: https://github.com/microbian-systems/AeroDB/blob/9cfbbf2dab7dff5f6032048bca90bb9c8b2c674a/src/AeroDB.WolverineFx/AeroDBMessageStore.cs
  assemblies:
  - AeroDB.WolverineFx
  namespace: AeroDB.WolverineFx
  summary: >-
    SurrealDB (AeroDB) backed implementation of Wolverine's IMessageStore and all sub-interfaces.

    All operations use SurrealQL RawQuery with parameterized queries.

    Envelope bodies are stored as Base64 strings for reliable CBOR round-tripping.


    Schema initialization now delegates to the AeroDB <xref href="AeroDB.SchemaManager" data-throw-if-not-resolved="false"></xref> pipeline

    via typed POCOs (<xref href="AeroDB.WolverineFx.WolverineIncomingEnvelope" data-throw-if-not-resolved="false"></xref>, etc.) instead of

    a hardcoded SurrealQL string.
  example: []
  syntax:
    content: 'public sealed class AeroDBMessageStore : IMessageStore, IAsyncDisposable, IMessageInbox, IMessageOutbox, IDeadLetters, INodeAgentPersistence, IMessageStoreAdmin, IScheduledMessages'
    content.vb: Public NotInheritable Class AeroDBMessageStore Implements IMessageStore, IAsyncDisposable, IMessageInbox, IMessageOutbox, IDeadLetters, INodeAgentPersistence, IMessageStoreAdmin, IScheduledMessages
