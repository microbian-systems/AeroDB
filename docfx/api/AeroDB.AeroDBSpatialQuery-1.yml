  assemblies:
  - AeroDB
  namespace: AeroDB
  summary: >-
    Finds documents located within a specified distance from a reference point.

    Generates a bounding-box pre-filter + geo::DISTANCE post-filter.

    Results are sorted by distance ascending.
  example: []
  syntax:
    content: public ISpatialQuery<T> NearBy(Expression<Func<T, object>> locationField, double latitude, double longitude, double maxDistanceMeters)
    parameters:
