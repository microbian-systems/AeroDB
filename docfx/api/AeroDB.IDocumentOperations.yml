  name: IDocumentOperations
  nameWithType: IDocumentOperations
  fullName: AeroDB.IDocumentOperations
  type: Interface
  source:
    href: https://github.com/microbian-systems/AeroDB/blob/9cfbbf2dab7dff5f6032048bca90bb9c8b2c674a/src/AeroDB/IDocumentOperations.cs
  assemblies:
  - AeroDB
  namespace: AeroDB
  summary: >-
    Document CRUD operations shared between <xref href="AeroDB.IDocumentSession" data-throw-if-not-resolved="false"></xref> and projection operations.

    Provides the raw document read/write surface without session lifecycle methods.

    <br />

    Note: <code>LoadAsync&lt;T&gt;(id)</code> is available via <code>IQuerySession</code> cast — intentionally omitted

    to avoid diamond ambiguity with <code>IQuerySession</code> in the <code>IDocumentSession</code> hierarchy.
