    href: https://github.com/microbian-systems/AeroDB/blob/9cfbbf2dab7dff5f6032048bca90bb9c8b2c674a/src/AeroDB/Diagnostics/DocumentMetadataListener.cs
  assemblies:
  - AeroDB
  namespace: AeroDB.Diagnostics
  summary: >-
    Document session listener that auto-populates <xref href="AeroDB.Metadata.IDocumentMetadata" data-throw-if-not-resolved="false"></xref> properties

    (<xref href="AeroDB.Metadata.IDocumentMetadata.CreatedAt" data-throw-if-not-resolved="false"></xref>, <xref href="AeroDB.Metadata.IDocumentMetadata.LastModified" data-throw-if-not-resolved="false"></xref>,

    <xref href="AeroDB.Metadata.IDocumentMetadata.LastModifiedBy" data-throw-if-not-resolved="false"></xref>) during store operations.


    <p>

    Register via <code>StoreOptions.Listeners.Add(new DocumentMetadataListener())</code>

    or use the convenience extension method <code>o.EnableDocumentMetadata()</code>.

    </p>
  example: []
