- uid: AeroDB.IDocumentStore.LightweightSessionAsync(System.Threading.CancellationToken)
  commentId: M:AeroDB.IDocumentStore.LightweightSessionAsync(System.Threading.CancellationToken)
  id: LightweightSessionAsync(System.Threading.CancellationToken)
  parent: AeroDB.IDocumentStore
  langs:
  - csharp
  - vb
  name: LightweightSessionAsync(CancellationToken)
  nameWithType: IDocumentStore.LightweightSessionAsync(CancellationToken)
  fullName: AeroDB.IDocumentStore.LightweightSessionAsync(System.Threading.CancellationToken)
  type: Method
  source:
    href: https://github.com/microbian-systems/AeroDB/blob/9cfbbf2dab7dff5f6032048bca90bb9c8b2c674a/src/AeroDB/IDocumentStore.cs
  assemblies:
  - AeroDB
  namespace: AeroDB
  summary: >-
    Opens a lightweight document session with no identity map or change tracking

    (<xref href="AeroDB.DocumentTracking.None" data-throw-if-not-resolved="false"></xref>). Equivalent to

    <code>OpenSessionAsync(new SessionOptions { Tracking = DocumentTracking.None }, ct)</code>.

    This is the recommended default for most read/write operations, matching Marten's

    <code>LightweightSession()</code> pattern.
  example: []
  syntax:
    content: Task<IDocumentSession> LightweightSessionAsync(CancellationToken ct = default)
    parameters:
    - id: ct
      type: System.Threading.CancellationToken
    return:
      type: System.Threading.Tasks.Task{AeroDB.IDocumentSession}
    content.vb: Function LightweightSessionAsync(ct As CancellationToken = Nothing) As Task(Of IDocumentSession)
  overload: AeroDB.IDocumentStore.LightweightSessionAsync*
