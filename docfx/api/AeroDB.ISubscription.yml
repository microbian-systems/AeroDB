  langs:
  - csharp
  - vb
  name: ISubscription
  nameWithType: ISubscription
  fullName: AeroDB.ISubscription
  type: Interface
  source:
    href: https://github.com/microbian-systems/AeroDB/blob/9cfbbf2dab7dff5f6032048bca90bb9c8b2c674a/src/AeroDB/Events/ISubscription.cs
  assemblies:
  - AeroDB
  namespace: AeroDB
  summary: >-
    Event subscription for forwarding events to external handlers.

    Implement this interface to receive and process events as they are appended

    to streams. Subscriptions are managed by the async daemon and are tracked

    by <xref href="AeroDB.ISubscription.SubscriptionName" data-throw-if-not-resolved="false"></xref> for progress checkpointing.

    <br />

    This is a simplified Marten-parity interface. For advanced subscriptions

    with JasperFx types (<code>EventRange</code>,

    <code>ISubscriptionController</code>),

    use <xref href="AeroDB.IAeroDBSubscription" data-throw-if-not-resolved="false"></xref> instead.
  example: []
  syntax:
    content: public interface ISubscription
    content.vb: Public Interface ISubscription
- uid: AeroDB.ISubscription.ProcessEventsAsync(System.Collections.Generic.IReadOnlyList{AeroDB.IEvent},AeroDB.IDocumentOperations,System.Threading.CancellationToken)
  commentId: M:AeroDB.ISubscription.ProcessEventsAsync(System.Collections.Generic.IReadOnlyList{AeroDB.IEvent},AeroDB.IDocumentOperations,System.Threading.CancellationToken)
  id: ProcessEventsAsync(System.Collections.Generic.IReadOnlyList{AeroDB.IEvent},AeroDB.IDocumentOperations,System.Threading.CancellationToken)
  parent: AeroDB.ISubscription
  langs:
  - csharp
  - vb
  name: ProcessEventsAsync(IReadOnlyList<IEvent>, IDocumentOperations, CancellationToken)
  nameWithType: ISubscription.ProcessEventsAsync(IReadOnlyList<IEvent>, IDocumentOperations, CancellationToken)
  fullName: AeroDB.ISubscription.ProcessEventsAsync(System.Collections.Generic.IReadOnlyList<AeroDB.IEvent>, AeroDB.IDocumentOperations, System.Threading.CancellationToken)
  type: Method
  source:
    href: https://github.com/microbian-systems/AeroDB/blob/9cfbbf2dab7dff5f6032048bca90bb9c8b2c674a/src/AeroDB/Events/ISubscription.cs
  assemblies:
  - AeroDB
  namespace: AeroDB
  summary: >-
    Called when new events are appended to a stream. The implementation

    may use <code class="paramref">operations</code> for read/write access to the

    document store within the same transactional boundary.
  example: []
  syntax:
    content: Task ProcessEventsAsync(IReadOnlyList<IEvent> events, IDocumentOperations operations, CancellationToken ct)
    parameters:
    - id: events
      type: System.Collections.Generic.IReadOnlyList{AeroDB.IEvent}
      description: The batch of new events to process.
    - id: operations
      type: AeroDB.IDocumentOperations
      description: Document operations for reading/writing within the session.
    - id: ct
      type: System.Threading.CancellationToken
      description: Cancellation token.
    return:
      type: System.Threading.Tasks.Task
    content.vb: Function ProcessEventsAsync(events As IReadOnlyList(Of IEvent), operations As IDocumentOperations, ct As CancellationToken) As Task
