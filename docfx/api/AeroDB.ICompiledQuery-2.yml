  name: ICompiledQuery<TDoc, TOut>
  nameWithType: ICompiledQuery<TDoc, TOut>
  fullName: AeroDB.ICompiledQuery<TDoc, TOut>
  type: Interface
  source:
    href: https://github.com/microbian-systems/AeroDB/blob/9cfbbf2dab7dff5f6032048bca90bb9c8b2c674a/src/AeroDB/Compiled/CompiledQueryInterfaces.cs
  assemblies:
  - AeroDB
  namespace: AeroDB
  summary: >-
    Core compiled query interface. The query type has properties that serve as

    parameters, and <xref href="AeroDB.ICompiledQuery%602.QueryIs" data-throw-if-not-resolved="false"></xref> returns an expression tree that

    translates those parameters into a LINQ query.
  example: []
  syntax:
    content: 'public interface ICompiledQuery<TDoc, TOut> : ICompiledQueryMarker where TDoc : class'
    typeParameters:
    - id: TDoc
      description: The document type being queried.
    - id: TOut
      description: >-
        The result type (single element for scalar queries,
                    <code>IEnumerable&lt;TOut&gt;</code> for list queries).
    content.vb: Public Interface ICompiledQuery(Of TDoc As Class, TOut) Inherits ICompiledQueryMarker
  nameWithType.vb: ICompiledQuery(Of TDoc, TOut)
  fullName.vb: AeroDB.ICompiledQuery(Of TDoc, TOut)
  name.vb: ICompiledQuery(Of TDoc, TOut)
- uid: AeroDB.ICompiledQuery`2.QueryIs
  commentId: M:AeroDB.ICompiledQuery`2.QueryIs
  id: QueryIs
  parent: AeroDB.ICompiledQuery`2
  langs:
  - csharp
  - vb
  name: QueryIs()
  nameWithType: ICompiledQuery<TDoc, TOut>.QueryIs()
  fullName: AeroDB.ICompiledQuery<TDoc, TOut>.QueryIs()
  type: Method
  source:
    href: https://github.com/microbian-systems/AeroDB/blob/9cfbbf2dab7dff5f6032048bca90bb9c8b2c674a/src/AeroDB/Compiled/CompiledQueryInterfaces.cs
  assemblies:
  - AeroDB
  namespace: AeroDB
  summary: >-
    Returns the LINQ expression that defines the query.

    The query object's property values are captured in the expression tree

    and replaced with parameterized SurrealQL at plan-build time.
  example: []
  syntax:
    content: Expression<Func<ISurrealDbQueryable<TDoc>, TOut>> QueryIs()
    return:
      type: System.Linq.Expressions.Expression{System.Func{AeroDB.ISurrealDbQueryable{{TDoc}},{TOut}}}
    content.vb: Function QueryIs() As Expression(Of Func(Of ISurrealDbQueryable(Of TDoc), TOut))
