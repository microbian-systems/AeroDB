  type: Interface
  source:
    href: https://github.com/microbian-systems/AeroDB/blob/9cfbbf2dab7dff5f6032048bca90bb9c8b2c674a/src/AeroDB/Configuration/IConfigureAeroDBOfTStore.cs
  assemblies:
  - AeroDB
  namespace: AeroDB
  summary: >-
    Typed variant of <xref href="AeroDB.IConfigureAeroDB" data-throw-if-not-resolved="false"></xref> for store-specific configuration.

    Mimics Marten's <code>IConfigureMarten&lt;T&gt;</code>.

    When multiple store types exist, implementations of this interface are applied only

    to the matching store type (secondary store pattern).
  example: []
  syntax:
    content: 'public interface IConfigureAeroDB<TStore> : IConfigureAeroDB where TStore : IDocumentStore'
    typeParameters:
    - id: TStore
      description: The concrete document store type (e.g., <code>IDocumentStore</code> or a derived type).
    content.vb: Public Interface IConfigureAeroDB(Of TStore As IDocumentStore) Inherits IConfigureAeroDB
