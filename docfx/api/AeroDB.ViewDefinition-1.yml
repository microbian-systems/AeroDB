- uid: AeroDB.ViewDefinition`1.Select(System.Func{AeroDB.ViewSelectBuilder{`0},AeroDB.ViewSelectBuilder{`0}})
  commentId: M:AeroDB.ViewDefinition`1.Select(System.Func{AeroDB.ViewSelectBuilder{`0},AeroDB.ViewSelectBuilder{`0}})
  id: Select(System.Func{AeroDB.ViewSelectBuilder{`0},AeroDB.ViewSelectBuilder{`0}})
  parent: AeroDB.ViewDefinition`1
  langs:
  - csharp
  - vb
  name: Select(Func<ViewSelectBuilder<T>, ViewSelectBuilder<T>>)
  nameWithType: ViewDefinition<T>.Select(Func<ViewSelectBuilder<T>, ViewSelectBuilder<T>>)
  fullName: AeroDB.ViewDefinition<T>.Select(System.Func<AeroDB.ViewSelectBuilder<T>, AeroDB.ViewSelectBuilder<T>>)
  type: Method
  source:
    href: https://github.com/microbian-systems/AeroDB/blob/9cfbbf2dab7dff5f6032048bca90bb9c8b2c674a/src/AeroDB/Schema/ViewDefinition.cs
  assemblies:
  - AeroDB
  namespace: AeroDB
  summary: >-
    Defines the SELECT columns using a type-safe fluent builder.

    Supports aggregates, column references, graph traversal, and raw SurrealQL expressions.

    Preferred over <xref href="AeroDB.ViewDefinition%601.WithSelect(System.String)" data-throw-if-not-resolved="false"></xref> for structured projections.
  example:
  - >-
    <pre><code class="lang-csharp">view.Select(cols =&gt; cols
        .Count().As("total")
        .Average(r =&gt; r.Rating).As("avg")
        .Column(r =&gt; r.Title)
        .Graph().Out&lt;Author&gt;("wrote").Select(a =&gt; a.Name).As("author")
    );</code></pre>
  syntax:
    content: public ViewDefinition<T> Select(Func<ViewSelectBuilder<T>, ViewSelectBuilder<T>> build)
    parameters:
    - id: build
      type: System.Func{AeroDB.ViewSelectBuilder{{T}},AeroDB.ViewSelectBuilder{{T}}}
    return:
      type: AeroDB.ViewDefinition`1
    content.vb: Public Function [Select](build As Func(Of ViewSelectBuilder(Of T), ViewSelectBuilder(Of T))) As ViewDefinition(Of T)
  overload: AeroDB.ViewDefinition`1.Select*
  nameWithType.vb: ViewDefinition(Of T).Select(Func(Of ViewSelectBuilder(Of T), ViewSelectBuilder(Of T)))
  fullName.vb: AeroDB.ViewDefinition(Of T).Select(System.Func(Of AeroDB.ViewSelectBuilder(Of T), AeroDB.ViewSelectBuilder(Of T)))
  name.vb: Select(Func(Of ViewSelectBuilder(Of T), ViewSelectBuilder(Of T)))
