    href: https://github.com/microbian-systems/AeroDB/blob/9cfbbf2dab7dff5f6032048bca90bb9c8b2c674a/src/AeroDB/Schema/DocumentMapping.cs
  assemblies:
  - AeroDB
  namespace: AeroDB
  summary: >-
    Defines a DISKANN vector index on the specified property.

    DiskANN is a disk-based approximate nearest-neighbour index for very large

    embedding sets. Uses the same &lt;|K, EF|&gt; query operator as HNSW.

    Available since SurrealDB 3.1. Best when the working set exceeds available RAM.
  example: []
  syntax:
    content: public DocumentMapping<T> DiskannIndex<TProp>(Expression<Func<T, TProp>> property, int dimension, string vectorType = "F32", string distance = "COSINE", int? degree = null, int? lBuild = null, double? alpha = null, bool hashedVector = false)
    parameters:
    - id: property
      type: System.Linq.Expressions.Expression{System.Func{{T},{TProp}}}
      description: The property storing the vector embedding.
    - id: dimension
      type: System.Int32
      description: The dimensionality of the vector.
    - id: vectorType
      type: System.String
      description: 'Element type: F32 (default), F16, I8, or U8.'
    - id: distance
      type: System.String
      description: 'The distance function: COSINE (default), EUCLIDEAN, INNER_PRODUCT, or COSINE_NORMALIZED.'
    - id: degree
      type: System.Nullable{System.Int32}
      description: DiskANN graph degree (default 64). Higher values improve accuracy at cost of memory.
    - id: lBuild
      type: System.Nullable{System.Int32}
      description: Construction search-list size (default 100).
    - id: alpha
      type: System.Nullable{System.Double}
      description: DiskANN pruning parameter (default 1.2).
    - id: hashedVector
      type: System.Boolean
      description: Whether to use hash-stabilized vector keys.
    typeParameters:
    - id: TProp
    return:
      type: AeroDB.DocumentMapping`1
