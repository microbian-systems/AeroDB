  assemblies:
  - AeroDB.WolverineFx
  namespace: AeroDB.WolverineFx
  summary: >-
    Scope-local carrier for the outbox-enrolled <xref href="AeroDB.IDocumentSession" data-throw-if-not-resolved="false"></xref> a handler is using.

    When a handler falls back to service location, Wolverine's generated code primes this holder

    so a service-located <xref href="AeroDB.IDocumentSession" data-throw-if-not-resolved="false"></xref> / <xref href="AeroDB.IQuerySession" data-throw-if-not-resolved="false"></xref> resolves

    to the SAME session enrolled with the active outbox. See GH-3001.
