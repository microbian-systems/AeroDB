items:
- uid: AeroDB.IConfigureAeroDB
  commentId: T:AeroDB.IConfigureAeroDB
  id: IConfigureAeroDB
  parent: AeroDB
  children:
  - AeroDB.IConfigureAeroDB.Configure(AeroDB.StoreOptions)
  - AeroDB.IConfigureAeroDB.Configure(System.IServiceProvider,AeroDB.StoreOptions)
  langs:
  - csharp
  - vb
  name: IConfigureAeroDB
  nameWithType: IConfigureAeroDB
  fullName: AeroDB.IConfigureAeroDB
  type: Interface
  source:
    href: https://github.com/microbian-systems/AeroDB/blob/9cfbbf2dab7dff5f6032048bca90bb9c8b2c674a/src/AeroDB/Configuration/IConfigureAeroDB.cs
  assemblies:
  - AeroDB
  namespace: AeroDB
  summary: >-
    DI-registered (or directly added) AeroDB configuration module.

    Implementations are applied during <xref href="AeroDB.DocumentStore.InitializeAsync(System.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref>.


    <p>

    Implementers may override either overload:


    <ul><li><xref href="AeroDB.IConfigureAeroDB.Configure(AeroDB.StoreOptions)" data-throw-if-not-resolved="false"></xref> — simple configuration (backward-compatible).</li><li><xref href="AeroDB.IConfigureAeroDB.Configure(System.IServiceProvider%2cAeroDB.StoreOptions)" data-throw-if-not-resolved="false"></xref> — configuration with DI service access.</li></ul>


    The two-parameter overload has a default implementation that delegates to the single-parameter

    overload, so existing implementations need no changes.

    </p>
  example: []
  syntax:
    content: public interface IConfigureAeroDB
    content.vb: Public Interface IConfigureAeroDB
  derivedClasses:
  - AeroDB.WolverineFx.WolverineEnvelopeSchemas
