  name: Configure(IServiceProvider?, StoreOptions)
  nameWithType: IConfigureAeroDB.Configure(IServiceProvider?, StoreOptions)
  fullName: AeroDB.IConfigureAeroDB.Configure(System.IServiceProvider?, AeroDB.StoreOptions)
  type: Method
  source:
    href: https://github.com/microbian-systems/AeroDB/blob/9cfbbf2dab7dff5f6032048bca90bb9c8b2c674a/src/AeroDB/Configuration/IConfigureAeroDB.cs
  assemblies:
  - AeroDB
  namespace: AeroDB
  summary: >-
    Called during <code>DocumentStore.InitializeAsync</code> with optional

    <xref href="System.IServiceProvider" data-throw-if-not-resolved="false"></xref> for DI-resolved services.

    Default implementation delegates to <xref href="AeroDB.IConfigureAeroDB.Configure(AeroDB.StoreOptions)" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: void Configure(IServiceProvider? services, StoreOptions options)
    parameters:
    - id: services
      type: System.IServiceProvider
    - id: options
      type: AeroDB.StoreOptions
    content.vb: Sub Configure(services As IServiceProvider, options As StoreOptions)
