      type: JasperFx.Events.Projections.EventRange
    - id: controller
      type: JasperFx.Events.Daemon.ISubscriptionController
    - id: session
      type: AeroDB.IDocumentSession
    - id: cancellationToken
      type: System.Threading.CancellationToken
    return:
      type: System.Threading.Tasks.Task
    content.vb: Public MustOverride Function ProcessEventsAsync(page As EventRange, controller As ISubscriptionController, session As IDocumentSession, cancellationToken As CancellationToken) As Task
