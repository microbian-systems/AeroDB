  assemblies:
  - AeroDB.Reactive
  namespace: AeroDB
  summary: >-
    Bridges the live query builder to an <xref href="System.IObservable%601" data-throw-if-not-resolved="false"></xref> of <xref href="AeroDB.LiveQuery.AeroDBLiveChange%601" data-throw-if-not-resolved="false"></xref>.

    Each subscriber triggers a fresh <xref href="AeroDB.LiveQuery.IAeroDBLiveQueryBuilder%601.SubscribeAsync(System.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref>

    call (deferred execution). The server-side query starts only when the first subscriber

    attaches. Unsubscribing disposes the underlying query.
