  summary: >-
    Wraps an existing <xref href="AeroDB.LiveQuery.IAeroDBLiveQuery%601" data-throw-if-not-resolved="false"></xref> as an <xref href="System.IObservable%601" data-throw-if-not-resolved="false"></xref> of <xref href="AeroDB.LiveQuery.AeroDBLiveChange%601" data-throw-if-not-resolved="false"></xref>.

    Caller owns the query lifecycle — the observable does not dispose the query.
