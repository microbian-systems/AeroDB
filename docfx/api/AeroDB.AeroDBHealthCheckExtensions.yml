  name: AddAeroDBCheck(IHealthChecksBuilder, string, TimeSpan?)
  nameWithType: AeroDBHealthCheckExtensions.AddAeroDBCheck(IHealthChecksBuilder, string, TimeSpan?)
  fullName: AeroDB.AeroDBHealthCheckExtensions.AddAeroDBCheck(Microsoft.Extensions.DependencyInjection.IHealthChecksBuilder, string, System.TimeSpan?)
  type: Method
  source:
    href: https://github.com/microbian-systems/AeroDB/blob/9cfbbf2dab7dff5f6032048bca90bb9c8b2c674a/src/AeroDB/Health/AeroDBHealthCheckExtensions.cs
  assemblies:
  - AeroDB
  namespace: AeroDB
  summary: >-
    Adds a health check for the AeroDB async daemon.

    Resolves <xref href="AeroDB.AsyncDaemon" data-throw-if-not-resolved="false"></xref> from the registered <xref href="AeroDB.IDocumentStore" data-throw-if-not-resolved="false"></xref>.

    Must be called after <code>services.AddAeroDB(...)</code>.
  example: []
  syntax:
    content: public static IHealthChecksBuilder AddAeroDBCheck(this IHealthChecksBuilder builder, string name = "AeroDB-daemon", TimeSpan? pollInterval = null)
    parameters:
    - id: builder
      type: Microsoft.Extensions.DependencyInjection.IHealthChecksBuilder
      description: The health checks builder.
    - id: name
      type: System.String
      description: 'The health check registration name (default: "AeroDB-daemon").'
    - id: pollInterval
      type: System.Nullable{System.TimeSpan}
      description: 'Expected poll interval for liveness calculation (default: 5 seconds).'
    return:
      type: Microsoft.Extensions.DependencyInjection.IHealthChecksBuilder
      description: The health checks builder for chaining.
    content.vb: Public Shared Function AddAeroDBCheck(builder As IHealthChecksBuilder, name As String = "AeroDB-daemon", pollInterval As TimeSpan? = Nothing) As IHealthChecksBuilder
