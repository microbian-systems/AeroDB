    content: public AnalyzerOptions DefineAnalyzer(string name, string[]? tokenizers = null, string[]? filters = null)
    parameters:
    - id: name
      type: System.String
      description: Unique analyzer name (e.g. "my_analyzer").
    - id: tokenizers
      type: System.String[]
      description: 'Tokenizers to apply (default: blank, class, punct).'
    - id: filters
      type: System.String[]
      description: Optional filters (e.g. SNOWBALL(en)).
    return:
      type: AeroDB.AnalyzerOptions
