  parent: AeroDB.IAeroDBSubscription
  langs:
  - csharp
  - vb
  name: ProcessEventsAsync(EventRange, ISubscriptionController, IDocumentSession, CancellationToken)
  nameWithType: IAeroDBSubscription.ProcessEventsAsync(EventRange, ISubscriptionController, IDocumentSession, CancellationToken)
  fullName: AeroDB.IAeroDBSubscription.ProcessEventsAsync(JasperFx.Events.Projections.EventRange, JasperFx.Events.Daemon.ISubscriptionController, AeroDB.IDocumentSession, System.Threading.CancellationToken)
  type: Method
  source:
    href: https://github.com/microbian-systems/AeroDB/blob/9cfbbf2dab7dff5f6032048bca90bb9c8b2c674a/src/AeroDB/Events/IAeroDBSubscription.cs
  assemblies:
  - AeroDB
  namespace: AeroDB
  summary: >-
    Process a batch of events. Called by the daemon with an open session.

    Use <code class="paramref">session</code> for reads/writes and

    <code class="paramref">controller</code> to report dead letters or failures.
  example: []
  syntax:
    content: Task ProcessEventsAsync(EventRange page, ISubscriptionController controller, IDocumentSession session, CancellationToken cancellationToken)
    parameters:
    - id: page
      type: JasperFx.Events.Projections.EventRange
    - id: controller
      type: JasperFx.Events.Daemon.ISubscriptionController
    - id: session
      type: AeroDB.IDocumentSession
    - id: cancellationToken
      type: System.Threading.CancellationToken
    return:
      type: System.Threading.Tasks.Task
    content.vb: Function ProcessEventsAsync(page As EventRange, controller As ISubscriptionController, session As IDocumentSession, cancellationToken As CancellationToken) As Task
  overload: AeroDB.IAeroDBSubscription.ProcessEventsAsync*
