  name: CompiledQueryPlanner
  nameWithType: CompiledQueryPlanner
  fullName: AeroDB.CompiledQueryPlanner
  type: Class
  source:
    href: https://github.com/microbian-systems/AeroDB/blob/9cfbbf2dab7dff5f6032048bca90bb9c8b2c674a/src/AeroDB/Compiled/CompiledQueryPlanner.cs
  assemblies:
  - AeroDB
  namespace: AeroDB
  summary: >-
    Static planner for interface-based compiled queries (Marten-compatible pattern).


    For each unique compiled query type, the planner builds a <xref href="AeroDB.CompiledPlan" data-throw-if-not-resolved="false"></xref>

    once and caches it. The plan stores:


    <ul><li>The <xref href="AeroDB.SurrealQueryResult" data-throw-if-not-resolved="false"></xref> skeleton with sentinel parameter values.</li><li>A mapping from SurrealQL parameter keys ($p0, $p1, …) to query property names.</li><li>Which properties (if any) supply the LIMIT / START values.</li></ul>


    At execution time the skeleton is cloned, property values are read from the

    query instance, parameters are substituted, and the query is executed.
  example: []
  syntax:
    content: public static class CompiledQueryPlanner
