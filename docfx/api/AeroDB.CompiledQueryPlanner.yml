- uid: AeroDB.CompiledQueryPlanner
  commentId: T:AeroDB.CompiledQueryPlanner
  id: CompiledQueryPlanner
  parent: AeroDB
  children:
  - AeroDB.CompiledQueryPlanner.GetOrBuildPlan``2(AeroDB.ICompiledQuery{``0,``1})
