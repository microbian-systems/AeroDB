  name: SoftDeleteAsync<T>(IDocumentSession, string, CancellationToken)
  nameWithType: SoftDeleteExtensions.SoftDeleteAsync<T>(IDocumentSession, string, CancellationToken)
  fullName: AeroDB.SoftDeleteExtensions.SoftDeleteAsync<T>(AeroDB.IDocumentSession, string, System.Threading.CancellationToken)
  type: Method
  source:
    href: https://github.com/microbian-systems/AeroDB/blob/9cfbbf2dab7dff5f6032048bca90bb9c8b2c674a/src/AeroDB/SoftDelete/SoftDeleteExtensions.cs
  assemblies:
  - AeroDB
  namespace: AeroDB
  summary: >-
    Soft deletes a document by marking it as deleted instead of removing the record.

    The document is updated immediately via SurrealQL to set <code>deleted</code> and <code>deleted_at</code>.
  example: []
  syntax:
    content: 'public static Task SoftDeleteAsync<T>(this IDocumentSession session, string recordId, CancellationToken ct = default) where T : Record, ISoftDeleted'
    parameters:
    - id: session
      type: AeroDB.IDocumentSession
      description: The document session.
    - id: recordId
      type: System.String
      description: The string identifier of the record (e.g., "abc123").
    - id: ct
      type: System.Threading.CancellationToken
      description: Cancellation token.
    typeParameters:
    - id: T
      description: The document type, must extend <xref href="SurrealDb.Net.Models.Record" data-throw-if-not-resolved="false"></xref> and implement <xref href="AeroDB.ISoftDeleted" data-throw-if-not-resolved="false"></xref>.
    return:
      type: System.Threading.Tasks.Task
    content.vb: Public Shared Function SoftDeleteAsync(Of T As {Record, ISoftDeleted})(session As IDocumentSession, recordId As String, ct As CancellationToken = Nothing) As Task
