    href: https://github.com/microbian-systems/AeroDB/blob/9cfbbf2dab7dff5f6032048bca90bb9c8b2c674a/src/AeroDB/InternalSessionBase.cs
  assemblies:
  - AeroDB
  namespace: AeroDB
  summary: >-
    Returns a session scoped to the specified schema (database).

    When <code class="paramref">schemaName</code> is null, returns the parent <xref href="AeroDB.InternalSessionBase.Session" data-throw-if-not-resolved="false"></xref>.

    Otherwise, forks a new session via <xref href="SurrealDb.Net.ISurrealDbSession.ForkSession(System.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref>,

    calls <code>Use(ns, schemaName)</code>, and caches the result.
  example: []
  syntax:
    content: protected Task<ISurrealDbSession> GetSessionForSchemaAsync(string? schemaName, CancellationToken ct = default)
    parameters:
    - id: schemaName
      type: System.String
    - id: ct
      type: System.Threading.CancellationToken
    return:
      type: System.Threading.Tasks.Task{SurrealDb.Net.ISurrealDbSession}
    content.vb: Protected Function GetSessionForSchemaAsync(schemaName As String, ct As CancellationToken = Nothing) As Task(Of ISurrealDbSession)
  overload: AeroDB.InternalSessionBase.GetSessionForSchemaAsync*
  nameWithType.vb: InternalSessionBase.GetSessionForSchemaAsync(String, CancellationToken)
  fullName.vb: AeroDB.InternalSessionBase.GetSessionForSchemaAsync(String, System.Threading.CancellationToken)
  name.vb: GetSessionForSchemaAsync(String, CancellationToken)
