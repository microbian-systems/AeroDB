  assemblies:
  - AeroDB
  namespace: AeroDB
  summary: Tenant-scoped query operations. Provides document queries filtered by tenant.
  remarks: >-
    In AeroDB, <xref href="AeroDB.ITenantQueryOperations" data-throw-if-not-resolved="false"></xref> is implemented by the store

    and delegates to the existing <xref href="AeroDB.IDocumentStore.WithTenant(System.String)" data-throw-if-not-resolved="false"></xref>

    and session-level <xref href="AeroDB.IQuerySession.SetTenant(System.String)" data-throw-if-not-resolved="false"></xref> mechanisms.
  example: []
  syntax:
    content: public interface ITenantQueryOperations
    content.vb: Public Interface ITenantQueryOperations
