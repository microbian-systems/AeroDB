- uid: AeroDB.DocumentSession.BeginTransaction
  commentId: M:AeroDB.DocumentSession.BeginTransaction
  id: BeginTransaction
  parent: AeroDB.DocumentSession
  langs:
  - csharp
  - vb
  name: BeginTransaction()
  nameWithType: DocumentSession.BeginTransaction()
  fullName: AeroDB.DocumentSession.BeginTransaction()
  type: Method
  source:
    href: https://github.com/microbian-systems/AeroDB/blob/9cfbbf2dab7dff5f6032048bca90bb9c8b2c674a/src/AeroDB/DocumentSession.cs
  assemblies:
  - AeroDB
  namespace: AeroDB
  summary: >-
    Begins a database transaction synchronously.

    Prefer <xref href="AeroDB.DocumentSession.BeginTransactionAsync(System.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref> in ASP.NET contexts to avoid sync-over-async deadlock.
  example: []
  syntax:
    content: public IAeroDBTransaction BeginTransaction()
    return:
      type: AeroDB.IAeroDBTransaction
    content.vb: Public Function BeginTransaction() As IAeroDBTransaction
  overload: AeroDB.DocumentSession.BeginTransaction*
  implements:
  - AeroDB.IDocumentSession.BeginTransaction
- uid: AeroDB.DocumentSession.BeginTransactionAsync(System.Threading.CancellationToken)
  commentId: M:AeroDB.DocumentSession.BeginTransactionAsync(System.Threading.CancellationToken)
  id: BeginTransactionAsync(System.Threading.CancellationToken)
  parent: AeroDB.DocumentSession
  langs:
  - csharp
  - vb
  name: BeginTransactionAsync(CancellationToken)
  nameWithType: DocumentSession.BeginTransactionAsync(CancellationToken)
  fullName: AeroDB.DocumentSession.BeginTransactionAsync(System.Threading.CancellationToken)
  type: Method
  source:
    href: https://github.com/microbian-systems/AeroDB/blob/9cfbbf2dab7dff5f6032048bca90bb9c8b2c674a/src/AeroDB/DocumentSession.cs
  assemblies:
  - AeroDB
  namespace: AeroDB
  summary: >-
    Begins an explicit SurrealDB transaction asynchronously. Returns an <xref href="AeroDB.IAeroDBTransaction" data-throw-if-not-resolved="false"></xref>

    for explicit commit/rollback control. When active, <xref href="AeroDB.DocumentSession.SaveChangesAsync(System.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref> runs inside

    this transaction without auto-committing, supporting multiple <code>SaveChangesAsync</code> calls

    within a single transaction.


    <p>

    Alternative: use <xref href="AeroDB.DocumentSession.CommitTransactionAsync(System.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref> or <xref href="AeroDB.DocumentSession.RollbackTransactionAsync(System.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref>

    on the session directly.

    </p>
  example: []
  syntax:
    content: public Task<IAeroDBTransaction> BeginTransactionAsync(CancellationToken ct = default)
    parameters:
    - id: ct
      type: System.Threading.CancellationToken
    return:
      type: System.Threading.Tasks.Task{AeroDB.IAeroDBTransaction}
    content.vb: Public Function BeginTransactionAsync(ct As CancellationToken = Nothing) As Task(Of IAeroDBTransaction)
  overload: AeroDB.DocumentSession.BeginTransactionAsync*
  implements:
  - AeroDB.IDocumentSession.BeginTransactionAsync(System.Threading.CancellationToken)
