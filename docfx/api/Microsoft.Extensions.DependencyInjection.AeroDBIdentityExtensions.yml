      type: Microsoft.AspNetCore.Identity.IdentityBuilder
      description: The <xref href="Microsoft.AspNetCore.Identity.IdentityBuilder" data-throw-if-not-resolved="false"></xref> from <code>AddIdentity</code> or <code>AddDefaultIdentity</code>.
    typeParameters:
    - id: TUser
      description: The user type, must inherit from <xref href="Microsoft.AspNetCore.Identity.IdentityUser" data-throw-if-not-resolved="false"></xref>.
    - id: TRole
      description: The role type, must inherit from <xref href="Microsoft.AspNetCore.Identity.IdentityRole" data-throw-if-not-resolved="false"></xref>.
    return:
      type: Microsoft.AspNetCore.Identity.IdentityBuilder
      description: The <xref href="Microsoft.AspNetCore.Identity.IdentityBuilder" data-throw-if-not-resolved="false"></xref> for chaining.
    content.vb: Public Shared Function AddAeroDBStores(Of TUser As IdentityUser, TRole As IdentityRole)(builder As IdentityBuilder) As IdentityBuilder
