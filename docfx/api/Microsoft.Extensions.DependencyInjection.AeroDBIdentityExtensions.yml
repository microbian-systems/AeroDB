  summary: >-
    Registers <xref href="AeroDB.AspNetIdentity.AeroDBUserStore%602" data-throw-if-not-resolved="false"></xref> and <xref href="AeroDB.AspNetIdentity.AeroDBRoleStore%601" data-throw-if-not-resolved="false"></xref>

