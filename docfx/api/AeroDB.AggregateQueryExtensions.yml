  namespace: AeroDB
  summary: >-
    Starts an ad-hoc aggregate query builder. The source queryable provides

    the table name and any WHERE/ORDER BY/LIMIT clauses from the LINQ chain.

    The aggregate builder overrides the SELECT and GROUP BY.
  example: []
  syntax:
    content: 'public static AggregateQueryExecutor<T> AggregateQuery<T>(this IQueryable<T> source, Func<AggregateQueryBuilder<T>, AggregateQueryBuilder<T>> build) where T : class'
    parameters:
    - id: source
      type: System.Linq.IQueryable{{T}}
    - id: build
      type: System.Func{AeroDB.AggregateQueryBuilder{{T}},AeroDB.AggregateQueryBuilder{{T}}}
    typeParameters:
    - id: T
    return:
      type: AeroDB.AggregateQueryExecutor{{T}}
    content.vb: Public Shared Function AggregateQuery(Of T As Class)(source As IQueryable(Of T), build As Func(Of AggregateQueryBuilder(Of T), AggregateQueryBuilder(Of T))) As AggregateQueryExecutor(Of T)
