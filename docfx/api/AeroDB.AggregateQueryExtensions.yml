  summary: >-
    Starts an ad-hoc aggregate query builder from a session query.

    Equivalent to <code>session.Query&lt;T&gt;().AggregateQuery(b =&gt; ...)</code>.
  example: []
  syntax:
    content: 'public static AggregateQueryExecutor<T> AggregateQuery<T>(this IQuerySession session, Func<AggregateQueryBuilder<T>, AggregateQueryBuilder<T>> build) where T : class'
