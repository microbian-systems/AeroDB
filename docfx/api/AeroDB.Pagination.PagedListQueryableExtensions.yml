  namespace: AeroDB.Pagination
  summary: >-
    Returns a paged list. Uses a separate count query when <code class="paramref">useCountQuery</code>

    is true; otherwise uses Stats (single round trip).
  example: []
  syntax:
    content: 'public static Task<IPagedList<T>> ToPagedListAsync<T>(this ISurrealDbQueryable<T> queryable, int pageNumber, int pageSize, bool useCountQuery, CancellationToken ct = default) where T : class'
    parameters:
    - id: queryable
      type: AeroDB.ISurrealDbQueryable{{T}}
      description: The queryable source.
    - id: pageNumber
      type: System.Int32
      description: One-based page number.
    - id: pageSize
      type: System.Int32
      description: Number of items per page.
    - id: useCountQuery
      type: System.Boolean
      description: Use a separate count query instead of Stats.
    - id: ct
      type: System.Threading.CancellationToken
      description: Cancellation token.
    typeParameters:
    - id: T
      description: Document type.
    return:
      type: System.Threading.Tasks.Task{AeroDB.Pagination.IPagedList{{T}}}
      description: A paged list with total count, page info, and results.
