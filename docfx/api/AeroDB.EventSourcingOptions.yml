  assemblies:
  - AeroDB
  namespace: AeroDB
  summary: >-
    Register an event upcaster for type migration.

    When events with <code class="paramref">oldEventType</code> are deserialized, the

    <code class="paramref">upcast</code> function transforms them into the new event type.
  example: []
  syntax:
    content: 'public EventSourcingOptions Upcast<T>(string oldEventType, Func<object, T> upcast) where T : class'
    parameters:
    - id: oldEventType
      type: System.String
    - id: upcast
      type: System.Func{System.Object,{T}}
    typeParameters:
    - id: T
    return:
      type: AeroDB.EventSourcingOptions
    content.vb: Public Function Upcast(Of T As Class)(oldEventType As String, upcast As Func(Of Object, T)) As EventSourcingOptions
