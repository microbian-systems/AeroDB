- uid: AeroDB.ITenantOperations
  commentId: T:AeroDB.ITenantOperations
  id: ITenantOperations
  parent: AeroDB
  children:
  - AeroDB.ITenantOperations.ForTenant(System.String)
  langs:
  - csharp
  - vb
  name: ITenantOperations
  nameWithType: ITenantOperations
  fullName: AeroDB.ITenantOperations
  type: Interface
  source:
    href: https://github.com/microbian-systems/AeroDB/blob/9cfbbf2dab7dff5f6032048bca90bb9c8b2c674a/src/AeroDB/Tenancy/ITenantOperations.cs
  assemblies:
  - AeroDB
  namespace: AeroDB
  summary: >-
    Cross-tenant document operations within a session.

    Provides access to per-tenant query sessions for multi-tenancy scenarios.
  remarks: >-
    Marten parity: <code>ITenantOperations</code> / <code>ITenantQueryOperations</code> provide

    <code>ForTenant(tenantId) =&gt; IQuerySession</code> to scope operations to a specific tenant.

    <br />

    <b>Existing AeroDB API:</b> AeroDB already achieves the same capabilities through:


    <ul><li><xref href="AeroDB.IDocumentStore.WithTenant(System.String)" data-throw-if-not-resolved="false"></xref> — sets tenant for the next session creation.</li><li><xref href="AeroDB.IQuerySession.SetTenant(System.String)" data-throw-if-not-resolved="false"></xref> — scopes a session to a tenant.</li><li><xref href="AeroDB.IDocumentSession.ForTenant(System.String)" data-throw-if-not-resolved="false"></xref> — returns a session scoped to a tenant.</li></ul>


    This interface provides a unified Marten-compatible surface over those APIs.
  example: []
  syntax:
    content: public interface ITenantOperations
    content.vb: Public Interface ITenantOperations
- uid: AeroDB.ITenantOperations.ForTenant(System.String)
  commentId: M:AeroDB.ITenantOperations.ForTenant(System.String)
  id: ForTenant(System.String)
  parent: AeroDB.ITenantOperations
  langs:
  - csharp
  - vb
  name: ForTenant(string)
  nameWithType: ITenantOperations.ForTenant(string)
  fullName: AeroDB.ITenantOperations.ForTenant(string)
  type: Method
  source:
    href: https://github.com/microbian-systems/AeroDB/blob/9cfbbf2dab7dff5f6032048bca90bb9c8b2c674a/src/AeroDB/Tenancy/ITenantOperations.cs
  assemblies:
  - AeroDB
  namespace: AeroDB
  summary: >-
    Returns a query session scoped to the specified tenant.

    All subsequent queries and operations are isolated to that tenant's data.
  example: []
  syntax:
    content: IQuerySession ForTenant(string tenantId)
    parameters:
    - id: tenantId
      type: System.String
      description: The tenant identifier.
    return:
      type: AeroDB.IQuerySession
      description: A query session scoped to the given tenant.
    content.vb: Function ForTenant(tenantId As String) As IQuerySession
