items:
- uid: AeroDB.IGlobalConfigureAeroDB
  commentId: T:AeroDB.IGlobalConfigureAeroDB
  id: IGlobalConfigureAeroDB
  parent: AeroDB
  children: []
  langs:
  - csharp
  - vb
  name: IGlobalConfigureAeroDB
  nameWithType: IGlobalConfigureAeroDB
  fullName: AeroDB.IGlobalConfigureAeroDB
  type: Interface
  source:
    href: https://github.com/microbian-systems/AeroDB/blob/9cfbbf2dab7dff5f6032048bca90bb9c8b2c674a/src/AeroDB/Configuration/IGlobalConfigureAeroDB.cs
  assemblies:
  - AeroDB
  namespace: AeroDB
  summary: >-
    Marker interface for <xref href="AeroDB.IConfigureAeroDB" data-throw-if-not-resolved="false"></xref> implementations that apply

    globally to all store types (primary and secondary). Mimics Marten's

    <code>IGlobalConfigureMarten</code>.
  remarks: >-
    Configurators implementing only <xref href="AeroDB.IConfigureAeroDB" data-throw-if-not-resolved="false"></xref> are applied to

    the primary store only. Implement <xref href="AeroDB.IGlobalConfigureAeroDB" data-throw-if-not-resolved="false"></xref> (in addition

    to <xref href="AeroDB.IConfigureAeroDB" data-throw-if-not-resolved="false"></xref>) to have the configurator applied to secondary

    stores as well.
  example: []
  syntax:
    content: 'public interface IGlobalConfigureAeroDB : IConfigureAeroDB'
    content.vb: Public Interface IGlobalConfigureAeroDB Inherits IConfigureAeroDB
  inheritedMembers:
  - AeroDB.IConfigureAeroDB.Configure(AeroDB.StoreOptions)
  - AeroDB.IConfigureAeroDB.Configure(System.IServiceProvider,AeroDB.StoreOptions)
