  summary: >-
    Fluent builder for partial document updates (patch operations).

    Collects SET/INCREMENT/APPEND/DELETE operations and generates a SurrealQL

    UPDATE statement when <xref href="AeroDB.PatchExpression%601.ApplyAsync(System.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref> is called.
