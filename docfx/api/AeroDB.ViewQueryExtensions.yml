  assemblies:
  - AeroDB
  namespace: AeroDB
  summary: >-
    Queries an existing SurrealDB view or table by name, bypassing the type-based

    table name resolution. Use this to query pre-computed views created with

    <code>DEFINE TABLE ... AS SELECT ...</code>.
  example: []
  syntax:
    content: 'public static ISurrealDbQueryable<T> View<T>(this IQuerySession session, string viewName) where T : class'
    parameters:
    - id: session
      type: AeroDB.IQuerySession
      description: The query session.
    - id: viewName
      type: System.String
      description: The SurrealDB view/table name to query.
    typeParameters:
    - id: T
      description: The result entity type.
    return:
      type: AeroDB.ISurrealDbQueryable{{T}}
    content.vb: Public Shared Function View(Of T As Class)(session As IQuerySession, viewName As String) As ISurrealDbQueryable(Of T)
