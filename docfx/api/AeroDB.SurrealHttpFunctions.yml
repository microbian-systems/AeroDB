  type: Class
  source:
    href: https://github.com/microbian-systems/AeroDB/blob/9cfbbf2dab7dff5f6032048bca90bb9c8b2c674a/src/AeroDB/Linq/SurrealHttpFunctions.cs
  assemblies:
  - AeroDB
  namespace: AeroDB
  summary: >-
    SurrealDB http functions for use in LINQ expressions.

    <b>WARNING:</b> These functions execute synchronous HTTP requests from within SurrealDB

    during query evaluation. Each invocation adds network latency. Using them in

    <code>Where()</code> predicates may cause one HTTP call per evaluated row.

    Prefer using these in <code>Select()</code> projections where the call count is bounded.

    These methods are NOT callable at runtime — they exist for expression-tree translation only.
