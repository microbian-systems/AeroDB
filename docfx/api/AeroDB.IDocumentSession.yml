- uid: AeroDB.IDocumentSession.BeginTransaction
  commentId: M:AeroDB.IDocumentSession.BeginTransaction
  id: BeginTransaction
  parent: AeroDB.IDocumentSession
  langs:
  - csharp
  - vb
  name: BeginTransaction()
  nameWithType: IDocumentSession.BeginTransaction()
  fullName: AeroDB.IDocumentSession.BeginTransaction()
  type: Method
  source:
    href: https://github.com/microbian-systems/AeroDB/blob/9cfbbf2dab7dff5f6032048bca90bb9c8b2c674a/src/AeroDB/IDocumentStore.cs
  assemblies:
  - AeroDB
  namespace: AeroDB
  summary: >-
    Begins an explicit SurrealDB transaction. Returns an <xref href="AeroDB.IAeroDBTransaction" data-throw-if-not-resolved="false"></xref> for

    explicit commit/rollback control. When active, <xref href="AeroDB.IDocumentSession.SaveChangesAsync(System.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref> runs inside

    this transaction without auto-committing, supporting multiple <code>SaveChangesAsync</code> calls

    within a single transaction.


    <p>

    Alternative: use <xref href="AeroDB.IDocumentSession.CommitTransactionAsync(System.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref> or <xref href="AeroDB.IDocumentSession.RollbackTransactionAsync(System.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref>

    on the session directly.

    </p>
  example: []
  syntax:
    content: IAeroDBTransaction BeginTransaction()
    return:
      type: AeroDB.IAeroDBTransaction
    content.vb: Function BeginTransaction() As IAeroDBTransaction
  overload: AeroDB.IDocumentSession.BeginTransaction*
- uid: AeroDB.IDocumentSession.BeginTransactionAsync(System.Threading.CancellationToken)
  commentId: M:AeroDB.IDocumentSession.BeginTransactionAsync(System.Threading.CancellationToken)
  id: BeginTransactionAsync(System.Threading.CancellationToken)
  parent: AeroDB.IDocumentSession
  langs:
  - csharp
  - vb
  name: BeginTransactionAsync(CancellationToken)
  nameWithType: IDocumentSession.BeginTransactionAsync(CancellationToken)
  fullName: AeroDB.IDocumentSession.BeginTransactionAsync(System.Threading.CancellationToken)
  type: Method
  source:
    href: https://github.com/microbian-systems/AeroDB/blob/9cfbbf2dab7dff5f6032048bca90bb9c8b2c674a/src/AeroDB/IDocumentStore.cs
  assemblies:
  - AeroDB
  namespace: AeroDB
  summary: >-
    Begins an explicit SurrealDB transaction asynchronously. Returns an <xref href="AeroDB.IAeroDBTransaction" data-throw-if-not-resolved="false"></xref>

    for explicit commit/rollback control. When active, <xref href="AeroDB.IDocumentSession.SaveChangesAsync(System.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref> runs inside

    this transaction without auto-committing, supporting multiple <code>SaveChangesAsync</code> calls

    within a single transaction.


    <p>

    Alternative: use <xref href="AeroDB.IDocumentSession.CommitTransactionAsync(System.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref> or <xref href="AeroDB.IDocumentSession.RollbackTransactionAsync(System.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref>

    on the session directly.

    </p>
  example: []
  syntax:
    content: Task<IAeroDBTransaction> BeginTransactionAsync(CancellationToken ct = default)
    parameters:
    - id: ct
      type: System.Threading.CancellationToken
    return:
      type: System.Threading.Tasks.Task{AeroDB.IAeroDBTransaction}
    content.vb: Function BeginTransactionAsync(ct As CancellationToken = Nothing) As Task(Of IAeroDBTransaction)
  overload: AeroDB.IDocumentSession.BeginTransactionAsync*
