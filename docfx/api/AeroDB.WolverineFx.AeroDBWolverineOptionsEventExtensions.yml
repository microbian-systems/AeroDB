  nameWithType: AeroDBWolverineOptionsEventExtensions.ForwardAeroDBEventsToWolverine(WolverineOptions, Action<StoreOptions>?)
  fullName: AeroDB.WolverineFx.AeroDBWolverineOptionsEventExtensions.ForwardAeroDBEventsToWolverine(Wolverine.WolverineOptions, System.Action<AeroDB.StoreOptions>?)
  type: Method
  source:
    href: https://github.com/microbian-systems/AeroDB/blob/9cfbbf2dab7dff5f6032048bca90bb9c8b2c674a/src/AeroDB.WolverineFx/AeroDBWolverineOptionsEventExtensions.cs
  assemblies:
  - AeroDB.WolverineFx
  namespace: AeroDB.WolverineFx
  summary: >-
    Configure Wolverine to forward events appended to AeroDB event streams

    as Wolverine messages. Events are published atomically within the

    same transaction as the document session's save operation.


    Event forwarding is automatically enabled when sessions are created

    through <xref href="AeroDB.WolverineFx.AeroDBOutboxedSessionFactory" data-throw-if-not-resolved="false"></xref>. This method provides

    additional configuration hook for the AeroDB <xref href="AeroDB.StoreOptions" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public static void ForwardAeroDBEventsToWolverine(this WolverineOptions options, Action<StoreOptions>? configureStore = null)
    parameters:
    - id: options
      type: Wolverine.WolverineOptions
      description: The Wolverine options.
    - id: configureStore
      type: System.Action{AeroDB.StoreOptions}
      description: >-
        Optional callback to configure the underlying AeroDB <xref href="AeroDB.StoreOptions" data-throw-if-not-resolved="false"></xref>.

        Use this to set up event-related options on the document store.
    content.vb: Public Shared Sub ForwardAeroDBEventsToWolverine(options As WolverineOptions, configureStore As Action(Of StoreOptions) = Nothing)
