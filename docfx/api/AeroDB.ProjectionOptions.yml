  assemblies:
  - AeroDB
  namespace: AeroDB
  summary: >-
    Register a self-aggregating snapshot projection for T with the given lifecycle.

    Returns the document mapping for chaining (1:1 Marten parity).
  example: []
  syntax:
    content: 'public DocumentMapping<T> Snapshot<T>(ProjectionLifecycle lifecycle, Action<SnapshotOptions>? configure = null) where T : Record, new()'
    parameters:
    - id: lifecycle
      type: AeroDB.ProjectionLifecycle
    - id: configure
      type: System.Action{AeroDB.SnapshotOptions}
    typeParameters:
    - id: T
    return:
      type: AeroDB.DocumentMapping{{T}}
    content.vb: Public Function Snapshot(Of T As {Record, New})(lifecycle As ProjectionLifecycle, configure As Action(Of SnapshotOptions) = Nothing) As DocumentMapping(Of T)
