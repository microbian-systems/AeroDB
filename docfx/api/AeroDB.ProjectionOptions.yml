- uid: AeroDB.ProjectionOptions.RebuildOnStartup
  commentId: P:AeroDB.ProjectionOptions.RebuildOnStartup
  id: RebuildOnStartup
  parent: AeroDB.ProjectionOptions
  langs:
  - csharp
  - vb
  name: RebuildOnStartup
  nameWithType: ProjectionOptions.RebuildOnStartup
  fullName: AeroDB.ProjectionOptions.RebuildOnStartup
  type: Property
  source:
    href: https://github.com/microbian-systems/AeroDB/blob/9cfbbf2dab7dff5f6032048bca90bb9c8b2c674a/src/AeroDB/StoreOptions.cs
  assemblies:
  - AeroDB
  namespace: AeroDB
  summary: >-
    Whether to rebuild all projections during DocumentStore initialization.

    When true, each registered projection's RebuildAsync is called on startup.

    Useful for development or recovering from projection data loss.
  example: []
  syntax:
    content: public bool RebuildOnStartup { get; set; }
    parameters: []
    return:
      type: System.Boolean
    content.vb: Public Property RebuildOnStartup As Boolean
  overload: AeroDB.ProjectionOptions.RebuildOnStartup*
- uid: AeroDB.ProjectionOptions.RebuildProjectionNames
  commentId: P:AeroDB.ProjectionOptions.RebuildProjectionNames
  id: RebuildProjectionNames
  parent: AeroDB.ProjectionOptions
  langs:
  - csharp
  - vb
  name: RebuildProjectionNames
  nameWithType: ProjectionOptions.RebuildProjectionNames
  fullName: AeroDB.ProjectionOptions.RebuildProjectionNames
  type: Property
  source:
    href: https://github.com/microbian-systems/AeroDB/blob/9cfbbf2dab7dff5f6032048bca90bb9c8b2c674a/src/AeroDB/StoreOptions.cs
  assemblies:
  - AeroDB
  namespace: AeroDB
  summary: >-
    Array of projection names to rebuild on startup.

    When empty (default), all projections are rebuilt if <xref href="AeroDB.ProjectionOptions.RebuildOnStartup" data-throw-if-not-resolved="false"></xref> is true.

    When specified, only the named projections are rebuilt.

    Names should match IProjection EventTypes or a user-defined projection name.
  example: []
  syntax:
    content: public string[] RebuildProjectionNames { get; set; }
    parameters: []
    return:
      type: System.String[]
    content.vb: Public Property RebuildProjectionNames As String()
  overload: AeroDB.ProjectionOptions.RebuildProjectionNames*
