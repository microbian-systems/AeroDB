  assemblies:
  - AeroDB
  namespace: AeroDB
  summary: >-
    Creates a query provider with optional <xref href="AeroDB.InternalSessionBase" data-throw-if-not-resolved="false"></xref> for schema-based

    session routing. When <code class="paramref">sessionBase</code> is provided, queries are routed

    through the correct forked session based on the element type's schema mapping.
