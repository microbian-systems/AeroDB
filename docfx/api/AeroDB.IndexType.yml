- uid: AeroDB.IndexType.Diskann
  commentId: F:AeroDB.IndexType.Diskann
  id: Diskann
  parent: AeroDB.IndexType
  langs:
  - csharp
  - vb
  name: Diskann
  nameWithType: IndexType.Diskann
  fullName: AeroDB.IndexType.Diskann
  type: Field
  source:
    href: https://github.com/microbian-systems/AeroDB/blob/9cfbbf2dab7dff5f6032048bca90bb9c8b2c674a/src/AeroDB/Schema/IndexDefinition.cs
  assemblies:
  - AeroDB
  namespace: AeroDB
  summary: >-
    DISKANN vector index — DEFINE INDEX ... FIELDS ... DISKANN DIMENSION ... TYPE ... DIST ...

    Disk-based approximate nearest-neighbour search for very large embedding sets.

    Uses the same &lt;|K, EF|&gt; query operator as HNSW. Available since SurrealDB 3.1.

    Best when the working set exceeds available RAM (vs HNSW for in-memory).
  example: []
  syntax:
    content: Diskann = 3
    return:
      type: AeroDB.IndexType
