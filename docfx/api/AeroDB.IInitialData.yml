- uid: AeroDB.IInitialData.PopulateAsync(AeroDB.IDocumentSession,System.Threading.CancellationToken)
  commentId: M:AeroDB.IInitialData.PopulateAsync(AeroDB.IDocumentSession,System.Threading.CancellationToken)
  id: PopulateAsync(AeroDB.IDocumentSession,System.Threading.CancellationToken)
  parent: AeroDB.IInitialData
  langs:
  - csharp
  - vb
  name: PopulateAsync(IDocumentSession, CancellationToken)
  nameWithType: IInitialData.PopulateAsync(IDocumentSession, CancellationToken)
  fullName: AeroDB.IInitialData.PopulateAsync(AeroDB.IDocumentSession, System.Threading.CancellationToken)
  type: Method
  source:
    href: https://github.com/microbian-systems/AeroDB/blob/9cfbbf2dab7dff5f6032048bca90bb9c8b2c674a/src/AeroDB/IInitialData.cs
  assemblies:
  - AeroDB
  namespace: AeroDB
  summary: >-
    Called during store initialization. Use the session to populate seed data.

    The session is a lightweight write session. SaveChangesAsync is called after all

    <xref href="AeroDB.IInitialData" data-throw-if-not-resolved="false"></xref> implementations run.
  example: []
  syntax:
    content: Task PopulateAsync(IDocumentSession session, CancellationToken ct)
    parameters:
    - id: session
      type: AeroDB.IDocumentSession
    - id: ct
      type: System.Threading.CancellationToken
    return:
      type: System.Threading.Tasks.Task
    content.vb: Function PopulateAsync(session As IDocumentSession, ct As CancellationToken) As Task
  overload: AeroDB.IInitialData.PopulateAsync*
