- uid: AeroDB.AeroDBEfCoreServiceCollectionExtensions.AddAeroDBWithEfCore``1(Microsoft.Extensions.DependencyInjection.IServiceCollection,System.Action{AeroDB.StoreOptions})
  commentId: M:AeroDB.AeroDBEfCoreServiceCollectionExtensions.AddAeroDBWithEfCore``1(Microsoft.Extensions.DependencyInjection.IServiceCollection,System.Action{AeroDB.StoreOptions})
  id: AddAeroDBWithEfCore``1(Microsoft.Extensions.DependencyInjection.IServiceCollection,System.Action{AeroDB.StoreOptions})
  isExtensionMethod: true
  parent: AeroDB.AeroDBEfCoreServiceCollectionExtensions
  langs:
  - csharp
  - vb
  name: AddAeroDBWithEfCore<TDbContext>(IServiceCollection, Action<StoreOptions>)
  nameWithType: AeroDBEfCoreServiceCollectionExtensions.AddAeroDBWithEfCore<TDbContext>(IServiceCollection, Action<StoreOptions>)
  fullName: AeroDB.AeroDBEfCoreServiceCollectionExtensions.AddAeroDBWithEfCore<TDbContext>(Microsoft.Extensions.DependencyInjection.IServiceCollection, System.Action<AeroDB.StoreOptions>)
  type: Method
  source:
    href: https://github.com/microbian-systems/AeroDB/blob/9cfbbf2dab7dff5f6032048bca90bb9c8b2c674a/src/AeroDB.EntityFrameworkCore/ServiceCollectionExtensions.cs
  assemblies:
  - AeroDB.EntityFrameworkCore
  namespace: AeroDB
  summary: >-
    Registers AeroDB alongside EF Core for coordinated transactions.

    Consumers must also call <xref href="AeroDB.AeroDBEfCoreServiceCollectionExtensions.UseAeroDBTransactionManager%60%601(Microsoft.EntityFrameworkCore.DbContextOptionsBuilder)" data-throw-if-not-resolved="false"></xref>

    in their DbContext's <code>OnConfiguring</code> method to wire up the transaction

    manager inside EF Core's internal service provider.
  example: []
  syntax:
    content: 'public static IServiceCollection AddAeroDBWithEfCore<TDbContext>(this IServiceCollection services, Action<StoreOptions> configureAeroDB) where TDbContext : DbContext'
    parameters:
    - id: services
      type: Microsoft.Extensions.DependencyInjection.IServiceCollection
    - id: configureAeroDB
      type: System.Action{AeroDB.StoreOptions}
    typeParameters:
    - id: TDbContext
    return:
      type: Microsoft.Extensions.DependencyInjection.IServiceCollection
    content.vb: Public Shared Function AddAeroDBWithEfCore(Of TDbContext As DbContext)(services As IServiceCollection, configureAeroDB As Action(Of StoreOptions)) As IServiceCollection
  overload: AeroDB.AeroDBEfCoreServiceCollectionExtensions.AddAeroDBWithEfCore*
  nameWithType.vb: AeroDBEfCoreServiceCollectionExtensions.AddAeroDBWithEfCore(Of TDbContext)(IServiceCollection, Action(Of StoreOptions))
  fullName.vb: AeroDB.AeroDBEfCoreServiceCollectionExtensions.AddAeroDBWithEfCore(Of TDbContext)(Microsoft.Extensions.DependencyInjection.IServiceCollection, System.Action(Of AeroDB.StoreOptions))
  name.vb: AddAeroDBWithEfCore(Of TDbContext)(IServiceCollection, Action(Of StoreOptions))
- uid: AeroDB.AeroDBEfCoreServiceCollectionExtensions.UseAeroDBTransactionManager``1(Microsoft.EntityFrameworkCore.DbContextOptionsBuilder)
  commentId: M:AeroDB.AeroDBEfCoreServiceCollectionExtensions.UseAeroDBTransactionManager``1(Microsoft.EntityFrameworkCore.DbContextOptionsBuilder)
  id: UseAeroDBTransactionManager``1(Microsoft.EntityFrameworkCore.DbContextOptionsBuilder)
  isExtensionMethod: true
  parent: AeroDB.AeroDBEfCoreServiceCollectionExtensions
  langs:
  - csharp
  - vb
  name: UseAeroDBTransactionManager<TDbContext>(DbContextOptionsBuilder)
  nameWithType: AeroDBEfCoreServiceCollectionExtensions.UseAeroDBTransactionManager<TDbContext>(DbContextOptionsBuilder)
  fullName: AeroDB.AeroDBEfCoreServiceCollectionExtensions.UseAeroDBTransactionManager<TDbContext>(Microsoft.EntityFrameworkCore.DbContextOptionsBuilder)
  type: Method
  source:
    href: https://github.com/microbian-systems/AeroDB/blob/9cfbbf2dab7dff5f6032048bca90bb9c8b2c674a/src/AeroDB.EntityFrameworkCore/ServiceCollectionExtensions.cs
  assemblies:
  - AeroDB.EntityFrameworkCore
  namespace: AeroDB
  summary: >-
    Replaces EF Core's default <xref href="Microsoft.EntityFrameworkCore.Storage.IDbContextTransactionManager" data-throw-if-not-resolved="false"></xref> with

    a AeroDB-aware one so that <code>Database.BeginTransaction()</code> coordinates

    both SurrealDB and EF Core changes.

    Call this inside your DbContext's <code>OnConfiguring</code> method:


    <pre><code class="lang-csharp">protected override void OnConfiguring(DbContextOptionsBuilder options)
        =&gt; options.UseAeroDBTransactionManager&lt;MyDbContext&gt;();</code></pre>
  example: []
  syntax:
    content: 'public static DbContextOptionsBuilder UseAeroDBTransactionManager<TDbContext>(this DbContextOptionsBuilder optionsBuilder) where TDbContext : DbContext'
    parameters:
    - id: optionsBuilder
      type: Microsoft.EntityFrameworkCore.DbContextOptionsBuilder
    typeParameters:
    - id: TDbContext
    return:
      type: Microsoft.EntityFrameworkCore.DbContextOptionsBuilder
    content.vb: Public Shared Function UseAeroDBTransactionManager(Of TDbContext As DbContext)(optionsBuilder As DbContextOptionsBuilder) As DbContextOptionsBuilder
  overload: AeroDB.AeroDBEfCoreServiceCollectionExtensions.UseAeroDBTransactionManager*
  nameWithType.vb: AeroDBEfCoreServiceCollectionExtensions.UseAeroDBTransactionManager(Of TDbContext)(DbContextOptionsBuilder)
  fullName.vb: AeroDB.AeroDBEfCoreServiceCollectionExtensions.UseAeroDBTransactionManager(Of TDbContext)(Microsoft.EntityFrameworkCore.DbContextOptionsBuilder)
  name.vb: UseAeroDBTransactionManager(Of TDbContext)(DbContextOptionsBuilder)
