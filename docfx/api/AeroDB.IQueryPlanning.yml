    content: public interface IQueryPlanning
    content.vb: Public Interface IQueryPlanning
- uid: AeroDB.IQueryPlanning.SetUniqueValuesForQueryPlanning
  commentId: M:AeroDB.IQueryPlanning.SetUniqueValuesForQueryPlanning
  id: SetUniqueValuesForQueryPlanning
  parent: AeroDB.IQueryPlanning
  langs:
  - csharp
  - vb
  name: SetUniqueValuesForQueryPlanning()
  nameWithType: IQueryPlanning.SetUniqueValuesForQueryPlanning()
  fullName: AeroDB.IQueryPlanning.SetUniqueValuesForQueryPlanning()
  type: Method
  source:
    href: https://github.com/microbian-systems/AeroDB/blob/9cfbbf2dab7dff5f6032048bca90bb9c8b2c674a/src/AeroDB/Compiled/CompiledQueryInterfaces.cs
  assemblies:
  - AeroDB
  namespace: AeroDB
  summary: >-
    Called once during plan building, after the planner has set sentinel

    values on all public readable properties. Implementations can override

    specific property values to ensure distinguishable sentinels (e.g.,

    for properties whose types don't have default sentinels).
  example: []
  syntax:
    content: void SetUniqueValuesForQueryPlanning()
    content.vb: Sub SetUniqueValuesForQueryPlanning()
