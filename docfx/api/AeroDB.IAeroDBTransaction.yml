items:
- uid: AeroDB.IAeroDBTransaction
  commentId: T:AeroDB.IAeroDBTransaction
  id: IAeroDBTransaction
  parent: AeroDB
  children:
  - AeroDB.IAeroDBTransaction.CommitAsync(System.Threading.CancellationToken)
  - AeroDB.IAeroDBTransaction.RollbackAsync(System.Threading.CancellationToken)
  langs:
  - csharp
  - vb
  name: IAeroDBTransaction
  nameWithType: IAeroDBTransaction
  fullName: AeroDB.IAeroDBTransaction
  type: Interface
  source:
    href: https://github.com/microbian-systems/AeroDB/blob/9cfbbf2dab7dff5f6032048bca90bb9c8b2c674a/src/AeroDB/IAeroDBTransaction.cs
  assemblies:
  - AeroDB
  namespace: AeroDB
  summary: >-
    Represents an explicit SurrealDB transaction started by <xref href="AeroDB.IDocumentSession.BeginTransactionAsync(System.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref>

    or <xref href="AeroDB.IDocumentSession.BeginTransaction" data-throw-if-not-resolved="false"></xref>.

    Supports multiple <xref href="AeroDB.IDocumentSession.SaveChangesAsync(System.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref> calls within a single transaction.

    Implements <xref href="System.IAsyncDisposable" data-throw-if-not-resolved="false"></xref> — rolling back if not committed before disposal.
  example: []
  syntax:
    content: 'public interface IAeroDBTransaction : IAsyncDisposable'
    content.vb: Public Interface IAeroDBTransaction Inherits IAsyncDisposable
  inheritedMembers:
  - System.IAsyncDisposable.DisposeAsync
