  assemblies:
  - AeroDB
  namespace: AeroDB
  summary: Commits the transaction. After calling this, the session returns to auto-transact mode.
  example: []
  syntax:
    content: Task CommitAsync(CancellationToken ct = default)
    parameters:
    - id: ct
      type: System.Threading.CancellationToken
    return:
      type: System.Threading.Tasks.Task
    content.vb: Function CommitAsync(ct As CancellationToken = Nothing) As Task
  overload: AeroDB.IAeroDBTransaction.CommitAsync*
