  langs:
  - csharp
  - vb
  name: IBatchedQuery
  nameWithType: IBatchedQuery
  fullName: AeroDB.IBatchedQuery
  type: Interface
  source:
    href: https://github.com/microbian-systems/AeroDB/blob/9cfbbf2dab7dff5f6032048bca90bb9c8b2c674a/src/AeroDB/Batching/IBatchedQuery.cs
  assemblies:
  - AeroDB
  namespace: AeroDB
  summary: >-
    A batch of compiled queries that are executed together in a single

    SurrealDB multi-statement round trip (Marten-compatible pattern).


    Usage:


    <pre><code class="lang-csharp">var batch = session.CreateBatchQuery();

    var justin = batch.Query(new FindByFirstName { FirstName = "Justin" });

    var tamba = batch.Query(new FindByFirstName { FirstName = "Tamba" });

    await batch.Execute();

    var user1 = await justin;

    var user2 = await tamba;</code></pre>
  example: []
  syntax:
    content: public interface IBatchedQuery
    content.vb: Public Interface IBatchedQuery
