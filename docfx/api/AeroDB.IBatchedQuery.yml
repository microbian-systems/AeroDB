  summary: >-
    Executes all batched queries in a single round trip.

    Results are set on each future returned by <xref href="AeroDB.IBatchedQuery.Query%60%602(AeroDB.ICompiledQuery%7b%60%600%2c%60%601%7d)" data-throw-if-not-resolved="false"></xref>.

    May be called multiple times — items accumulate additively.
