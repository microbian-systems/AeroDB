  assemblies:
  - AeroDB
  namespace: AeroDB
  summary: >-
    Extracts the stream identity as a typed <code class="typeparamref">TId</code> from the events.

    Default: uses <xref href="AeroDB.IEvent.StreamKey" data-throw-if-not-resolved="false"></xref> for Guid, <xref href="AeroDB.IEvent.StreamId" data-throw-if-not-resolved="false"></xref> for string,

    or parses <xref href="AeroDB.IEvent.StreamId" data-throw-if-not-resolved="false"></xref> for numeric types.

    Override for custom identity derivation.
