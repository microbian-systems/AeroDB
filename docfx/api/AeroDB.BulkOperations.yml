  assemblies:
  - AeroDB
  namespace: AeroDB
  summary: >-
    Bulk inserts entities using a single SurrealDB batch INSERT statement per chunk,

    instead of per-row Store + SaveChangesAsync. This reduces N round-trips to

    ceil(N/batchSize) round-trips.
  example: []
  syntax:
    content: 'public static Task<int> BulkInsertAsync<T>(this IDocumentSession session, IReadOnlyList<T> entities, int batchSize = 100, CancellationToken ct = default) where T : class'
    parameters:
    - id: session
      type: AeroDB.IDocumentSession
    - id: entities
      type: System.Collections.Generic.IReadOnlyList{{T}}
    - id: batchSize
      type: System.Int32
    - id: ct
      type: System.Threading.CancellationToken
    typeParameters:
    - id: T
    return:
      type: System.Threading.Tasks.Task{System.Int32}
    content.vb: Public Shared Function BulkInsertAsync(Of T As Class)(session As IDocumentSession, entities As IReadOnlyList(Of T), batchSize As Integer = 100, ct As CancellationToken = Nothing) As Task(Of Integer)
