  summary: >-
    Returns a parameter placeholder string (<code>$p0</code>, <code>$p1</code>, ...)

    and records the value in the parameter dictionary.

    Note: dictionary keys omit the <code>$</code> prefix (e.g., <code>"p0"</code>)

    to match SurrealDbClient expectations.
