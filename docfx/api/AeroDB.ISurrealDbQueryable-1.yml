  name: IncludeBatch<TKey, TInclude>(Expression<Func<T, TKey>>, IDictionary<TKey, TInclude>)
  nameWithType: ISurrealDbQueryable<T>.IncludeBatch<TKey, TInclude>(Expression<Func<T, TKey>>, IDictionary<TKey, TInclude>)
  fullName: AeroDB.ISurrealDbQueryable<T>.IncludeBatch<TKey, TInclude>(System.Linq.Expressions.Expression<System.Func<T, TKey>>, System.Collections.Generic.IDictionary<TKey, TInclude>)
  type: Method
  source:
    href: https://github.com/microbian-systems/AeroDB/blob/9cfbbf2dab7dff5f6032048bca90bb9c8b2c674a/src/AeroDB/ISurrealDbQueryable.cs
  assemblies:
  - AeroDB
  namespace: AeroDB
  summary: >-
    Eagerly loads related documents into a dictionary keyed by the property value.


    <p>Like <xref href="AeroDB.ISurrealDbQueryable%601.IncludeBatch%60%602(System.Linq.Expressions.Expression%7bSystem.Func%7b%600%2c%60%600%7d%7d%2cSystem.Action%7b%60%601%7d)" data-throw-if-not-resolved="false"></xref>,

    but populates an existing dictionary instead of invoking a callback.

    Uses SurrealDB's LET variable for server-side batch loading in a

    <b>single round trip</b> regardless of how many Includes are chained.</p>
  example: []
  syntax:
    content: 'ISurrealDbQueryable<T> IncludeBatch<TKey, TInclude>(Expression<Func<T, TKey>> key, IDictionary<TKey, TInclude> dictionary) where TInclude : class'
    parameters:
    - id: key
      type: System.Linq.Expressions.Expression{System.Func{{T},{TKey}}}
      description: Member expression selecting the key property.
    - id: dictionary
      type: System.Collections.Generic.IDictionary{{TKey},{TInclude}}
      description: Dictionary to populate with [key → document] entries.
    typeParameters:
    - id: TKey
      description: The key type (must match TProperty).
    - id: TInclude
      description: The type of the included document.
    return:
      type: AeroDB.ISurrealDbQueryable`1
      description: The queryable for chaining.
    content.vb: Function IncludeBatch(Of TKey, TInclude As Class)(key As Expression(Of Func(Of T, TKey)), dictionary As IDictionary(Of TKey, TInclude)) As ISurrealDbQueryable(Of T)
  overload: AeroDB.ISurrealDbQueryable`1.IncludeBatch*
  nameWithType.vb: ISurrealDbQueryable(Of T).IncludeBatch(Of TKey, TInclude)(Expression(Of Func(Of T, TKey)), IDictionary(Of TKey, TInclude))
  fullName.vb: AeroDB.ISurrealDbQueryable(Of T).IncludeBatch(Of TKey, TInclude)(System.Linq.Expressions.Expression(Of System.Func(Of T, TKey)), System.Collections.Generic.IDictionary(Of TKey, TInclude))
  name.vb: IncludeBatch(Of TKey, TInclude)(Expression(Of Func(Of T, TKey)), IDictionary(Of TKey, TInclude))
