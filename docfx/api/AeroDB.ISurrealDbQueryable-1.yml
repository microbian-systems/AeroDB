- uid: AeroDB.ISurrealDbQueryable`1.Fetch(System.Linq.Expressions.Expression{System.Func{`0,System.Object}})
  commentId: M:AeroDB.ISurrealDbQueryable`1.Fetch(System.Linq.Expressions.Expression{System.Func{`0,System.Object}})
  id: Fetch(System.Linq.Expressions.Expression{System.Func{`0,System.Object}})
  parent: AeroDB.ISurrealDbQueryable`1
  langs:
  - csharp
  - vb
  name: Fetch(Expression<Func<T, object?>>)
  nameWithType: ISurrealDbQueryable<T>.Fetch(Expression<Func<T, object?>>)
  fullName: AeroDB.ISurrealDbQueryable<T>.Fetch(System.Linq.Expressions.Expression<System.Func<T, object?>>)
  type: Method
  source:
    href: https://github.com/microbian-systems/AeroDB/blob/9cfbbf2dab7dff5f6032048bca90bb9c8b2c674a/src/AeroDB/ISurrealDbQueryable.cs
  assemblies:
  - AeroDB
  namespace: AeroDB
  summary: >-
    Adds a SurrealQL FETCH clause to eagerly expand a record-typed field.


    <p>SurrealDB's FETCH expands record references inline — the full

    referenced document is returned as part of the query result. This is

    a <b>server-side operation</b> requiring no additional round trips.</p>


    <p>Only use this on properties typed as <code>RecordId</code> or

    <code>RecordId?</code>. Other property types will be silently ignored by

    the SurrealDB engine.</p>


    <p>Performance: No additional round trips. The FETCH clause is

    appended to the generated SurrealQL. For multiple fields, call

    Fetch() multiple times — they accumulate.</p>
  example: []
  syntax:
    content: ISurrealDbQueryable<T> Fetch(Expression<Func<T, object?>> property)
    parameters:
    - id: property
      type: System.Linq.Expressions.Expression{System.Func{{T},System.Object}}
      description: >-
        A member expression selecting the record-typed property to expand.

        Example: <code>p =&gt; p.TeamId</code>
    return:
      type: AeroDB.ISurrealDbQueryable`1
      description: The queryable for chaining.
    content.vb: Function Fetch([property] As Expression(Of Func(Of T, Object))) As ISurrealDbQueryable(Of T)
  overload: AeroDB.ISurrealDbQueryable`1.Fetch*
  nameWithType.vb: ISurrealDbQueryable(Of T).Fetch(Expression(Of Func(Of T, Object)))
  fullName.vb: AeroDB.ISurrealDbQueryable(Of T).Fetch(System.Linq.Expressions.Expression(Of System.Func(Of T, Object)))
  name.vb: Fetch(Expression(Of Func(Of T, Object)))
- uid: AeroDB.ISurrealDbQueryable`1.IncludeBatch``2(System.Linq.Expressions.Expression{System.Func{`0,``0}},System.Action{``1})
  commentId: M:AeroDB.ISurrealDbQueryable`1.IncludeBatch``2(System.Linq.Expressions.Expression{System.Func{`0,``0}},System.Action{``1})
  id: IncludeBatch``2(System.Linq.Expressions.Expression{System.Func{`0,``0}},System.Action{``1})
  parent: AeroDB.ISurrealDbQueryable`1
  langs:
  - csharp
  - vb
  name: IncludeBatch<TProperty, TInclude>(Expression<Func<T, TProperty>>, Action<TInclude>)
  nameWithType: ISurrealDbQueryable<T>.IncludeBatch<TProperty, TInclude>(Expression<Func<T, TProperty>>, Action<TInclude>)
  fullName: AeroDB.ISurrealDbQueryable<T>.IncludeBatch<TProperty, TInclude>(System.Linq.Expressions.Expression<System.Func<T, TProperty>>, System.Action<TInclude>)
  type: Method
  source:
    href: https://github.com/microbian-systems/AeroDB/blob/9cfbbf2dab7dff5f6032048bca90bb9c8b2c674a/src/AeroDB/ISurrealDbQueryable.cs
  assemblies:
  - AeroDB
  namespace: AeroDB
  summary: >-
    Eagerly loads related documents using SurrealDB's LET variable for

    <b>server-side batch loading in a single round trip</b>.


    <p>The generated SurrealQL uses a LET variable to cache the filtered

    main query results, then includes are resolved via subqueries against

    the in-memory LET variable — equivalent to PostgreSQL temp tables

    but using SurrealDB's native variable system.</p>


    <p><b>Performance:</b> One round trip regardless of how many Includes

    are chained. The main WHERE filter is evaluated once by the LET statement.</p>


    <p><b>SurrealQL pattern:</b>

    <pre><code class="lang-csharp">LET $main = (SELECT * FROM source WHERE ...);
                 SELECT * FROM $main;
                 SELECT * FROM target WHERE id IN (SELECT VALUE fk FROM $main);</code></pre>
    </p>
  example: []
  syntax:
    content: 'ISurrealDbQueryable<T> IncludeBatch<TProperty, TInclude>(Expression<Func<T, TProperty>> property, Action<TInclude> callback) where TInclude : class'
    parameters:
    - id: property
      type: System.Linq.Expressions.Expression{System.Func{{T},{TProperty}}}
      description: >-
        A member expression selecting the property that holds the foreign key.

        Example: <code>i =&gt; i.AssigneeId</code>
    - id: callback
      type: System.Action{{TInclude}}
      description: Invoked once for each loaded TInclude document. Use to populate side collections.
    typeParameters:
    - id: TProperty
      description: The property type on T (e.g., Guid for an Id reference).
    - id: TInclude
      description: The type of the included document.
    return:
      type: AeroDB.ISurrealDbQueryable`1
      description: The queryable for chaining.
    content.vb: Function IncludeBatch(Of TProperty, TInclude As Class)([property] As Expression(Of Func(Of T, TProperty)), callback As Action(Of TInclude)) As ISurrealDbQueryable(Of T)
  overload: AeroDB.ISurrealDbQueryable`1.IncludeBatch*
  nameWithType.vb: ISurrealDbQueryable(Of T).IncludeBatch(Of TProperty, TInclude)(Expression(Of Func(Of T, TProperty)), Action(Of TInclude))
  fullName.vb: AeroDB.ISurrealDbQueryable(Of T).IncludeBatch(Of TProperty, TInclude)(System.Linq.Expressions.Expression(Of System.Func(Of T, TProperty)), System.Action(Of TInclude))
  name.vb: IncludeBatch(Of TProperty, TInclude)(Expression(Of Func(Of T, TProperty)), Action(Of TInclude))
