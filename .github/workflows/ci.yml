name: CI (Build & Test)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore src/Dali.slnx

      - name: Build
        run: dotnet build src/Dali.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet run --project tests/Dali.Tests/Dali.Tests.csproj --configuration Release -- --reflection --no-progress --fail-fast
